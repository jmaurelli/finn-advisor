      description: |
        Purchases and refunds only. The target is an active expense category
        or Uncategorized; the result is a protected `manual` assignment.
        With `newRule`, the transaction and the new rule are saved together or
        not at all; the rule is appended to the end of the order and does not
        change other transactions. The new rule's client ID is the command's
        retry token. Allowed on archived accounts.
      security:
