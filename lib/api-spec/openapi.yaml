paths:
  # ---------------------------------------------------------------- health
  /healthz:
    get:
      operationId: healthCheck
      tags: [ health ]
      summary: Process liveness
      description: Returns only whether the process is alive. No data or paths.
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                alive:
                  value: { status: ok }
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [ health ]
      summary: Database and schema readiness
      description: Minimal readiness. May be restricted at the ingress.
      security: []
      responses:
        "200":
          description: Ready to serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
              examples:
                ready:
                  value: { status: ready, database: ok, schema: compatible }
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Not ready (for example an incompatible schema or maintenance)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
              examples:
                incompatibleSchema:
                  value: { status: not_ready, database: ok, schema: incompatible }

  # ---------------------------------------------------------------- session
  /session:
    get:
      operationId: getSession
      tags: [ session ]
      summary: Current session state
      description: |
        Returns signed-out status, or safe session metadata and the CSRF token.
        Never extends the idle deadline.
      security:
        - {}
        - sessionCookie: []
      responses:
        "200":
          description: Session state
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
              examples:
                signedIn:
                  $ref: "#/components/examples/SignedInSession"
                signedOut:
                  value: { authenticated: false }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /session/login:
    post:
      operationId: login
      tags: [ session ]
      summary: Sign in with the owner password
      description: |
        Requires a same-origin `Origin` and `application/json`. Rotates the
        session identity and sets the `__Host-money_desk_session` cookie
        (Secure, HttpOnly, SameSite=Strict, Path=/). Failed attempts are
        throttled persistently.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              login:
                value: { password: "synthetic-correct-horse" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedInSession"
              examples:
                signedIn:
                  $ref: "#/components/examples/SignedInSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidCredentials:
                  $ref: "#/components/examples/Problem_invalid_credentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /session/activity:
    post:
      operationId: recordSessionActivity
      tags: [ session ]
      summary: Report recent owner interaction
      description: |
        Sent at most once per 30 seconds after trusted keyboard, pointer or
        touch activity on a visible page. Uses server receipt time; cannot
        revive an expired session.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Idle deadline extended
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedInSession"
              examples:
                extended:
                  $ref: "#/components/examples/SignedInSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /session/logout:
    post:
      operationId: logout
      tags: [ session ]
      summary: Sign out and revoke this session
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Signed out; the session cookie is cleared
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------- accounts
  /accounts:
    get:
      operationId: listAccounts
      tags: [ accounts ]
      summary: List accounts
      parameters:
        - name: status
          in: query
          description: Which accounts to include. Defaults to active only.
          schema:
            $ref: "#/components/schemas/AccountStatusFilter"
      responses:
        "200":
          description: Accounts, sorted by kind then display name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
              examples:
                twoAccounts:
                  $ref: "#/components/examples/ListAccounts_twoAccounts"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createAccount
      tags: [ accounts ]
      summary: Create an account with its tracking start and opening balance
      description: |
        The opening balance is the closing balance of the day before
        `trackingStartDate`. Retry-safe through the client-supplied `id`.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
            examples:
              checking:
                $ref: "#/components/examples/CreateAccount_request_checking"
      responses:
        "200":
          description: Same ID and content already created; the existing record is returned
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResult"
              examples:
                replayed:
                  $ref: "#/components/examples/CreateAccount_replayed"
        "201":
          description: Created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResult"
              examples:
                created:
                  $ref: "#/components/examples/CreateAccount_created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                clientIdConflict:
                  $ref: "#/components/examples/Problem_client_id_conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getAccount
      tags: [ accounts ]
      summary: Get one account
      responses:
        "200":
          description: The account
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                checking:
                  $ref: "#/components/examples/GetAccount_checking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateAccount
      tags: [ accounts ]
      summary: Edit account labels
      description: |
        Changes display name, masked suffix or provider. Kind, tracking start
        and opening balance are not editable here (use the baseline command).
        Archived accounts return 409 `reactivation_required`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
            examples:
              rename:
                value: { displayName: Synthetic Everyday Checking }
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResult"
              examples:
                updated:
                  $ref: "#/components/examples/UpdateAccount_updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                reactivationRequired:
                  $ref: "#/components/examples/Problem_reactivation_required"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteAccount
      tags: [ accounts ]
      summary: Permanently delete a completely unused account
      description: |
        Allowed only when the account has no transactions (including voided
        ones), import batches or previews, checkpoints, account-scoped rules,
        transfer legs or source identities. Otherwise 409 `account_in_use`
        lists the blocking references; archive instead. A repeated delete
        returns 404.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted; a deletion audit event was written
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                accountInUse:
