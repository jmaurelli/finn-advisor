              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
              examples:
                saved:
                  $ref: "#/components/examples/UpdatePreferences_saved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------- exports
  /exports/transactions.csv:
    get:
      operationId: exportTransactionsCsv
      tags: [ exports ]
      summary: Download every transaction matching the filters as CSV
      description: |
        Same filters and predicate as `listTransactions`, over all matching
        rows (not the loaded page), from one read snapshot. Columns:
        `posted_date,account_id,account_name,merchant,amount,kind,lifecycle,category_id,category_name,assignment_origin,note,transfer_pair_id,refund_link_purchase_id,transaction_id`.
        `amount` is signed exact decimal dollars (e.g. `-80.00`). Text fields
        starting with `=`, `+`, `-`, `@`, tab, carriage return or other control
        characters (after any leading whitespace) are prefixed with `'` to
        neutralize spreadsheet formulas; numeric and date columns are not
        altered. RFC 4180 quoting, UTF-8 with header row. Fails clearly
        (503/413) rather than returning a truncated file.
      parameters:
        - $ref: "#/components/parameters/FilterAccountId"
        - $ref: "#/components/parameters/FilterCategoryId"
        - $ref: "#/components/parameters/FilterKind"
        - $ref: "#/components/parameters/FilterOrigin"
        - $ref: "#/components/parameters/FilterLifecycle"
        - $ref: "#/components/parameters/FilterMonth"
        - $ref: "#/components/parameters/FilterFrom"
        - $ref: "#/components/parameters/FilterTo"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: CSV file
          headers:
            Content-Disposition:
              $ref: "#/components/headers/CsvDisposition"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/csv:
              schema:
                type: string
              examples:
                twoRows:
                  value: |
                    posted_date,account_id,account_name,merchant,amount,kind,lifecycle,category_id,category_name,assignment_origin,note,transfer_pair_id,refund_link_purchase_id,transaction_id
                    2026-04-02,20000000-0000-4000-8000-000000000001,Synthetic Checking,SYNTHETIC MARKET,-80.00,purchase,active,30000000-0000-4000-8000-000000000010,Groceries,manual,Synthetic acceptance fixture,,,10000000-0000-4000-8000-000000000001
                    2026-04-09,20000000-0000-4000-8000-000000000001,Synthetic Checking,'=SYNTHETIC FORMULA SHOP,30.00,refund,active,30000000-0000-4000-8000-000000000010,Groceries,rule,,,10000000-0000-4000-8000-000000000001,10000000-0000-4000-8000-000000000002
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exports/ledger.json:
    get:
      operationId: exportLedgerJson
      tags: [ exports ]
      summary: Download the full logical ledger as versioned JSON
      description: |
        Explicit allowlist from one read snapshot: preferences, accounts with
        baselines and checkpoints, transactions with history and links,
        categories, rules with revisions and runs, budget plans, and
        normalized import history. Never includes raw uploads, passwords,
        sessions, CSRF material, request digests, credentials, keys or file
        paths. Not a backup; there is no JSON reimport.
      responses:
        "200":
          description: JSON file
          headers:
            Content-Disposition:
              $ref: "#/components/headers/JsonDisposition"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerExport"
              examples:
                small:
                  $ref: "#/components/examples/ExportLedgerJson_small"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------- operations
  /backup-status:
    get:
      operationId: getBackupStatus
      tags: [ operations ]
      summary: Local and independent backup outcomes
      description: |
        Read from the status file written by the backup account. Local success
        never masks an independent-copy failure.
      responses:
        "200":
          description: Backup status per destination
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
              examples:
                driveFailing:
                  value:
                    statusFile: readable
                    readAt: "2026-05-02T12:00:00Z"
                    destinations:
                      - destination: local
                        state: ok
                        lastSuccessAt: "2026-05-02T07:10:00Z"
                        lastAttemptAt: "2026-05-02T07:10:00Z"
                        errorCode: null
                      - destination: independent
                        state: failed
                        lastSuccessAt: "2026-04-29T07:25:00Z"
                        lastAttemptAt: "2026-05-02T07:25:00Z"
                        errorCode: quota_exceeded
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
