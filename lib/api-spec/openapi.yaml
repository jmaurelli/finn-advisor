    parameters:
      - $ref: "#/components/parameters/RepairId"
    get:
      operationId: getRepairPreview
      tags: [ repairs ]
      summary: Get a repair preview or its confirmed result
      responses:
        "200":
          description: The preview (status shows ready, applied, stale or expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairPreview"
              examples:
                ready:
                  $ref: "#/components/examples/GetRepairPreview_ready"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /transaction-repairs/{repairId}/apply:
    parameters:
      - $ref: "#/components/parameters/RepairId"
    post:
      operationId: applyRepair
      tags: [ repairs ]
      summary: Confirm and apply a reviewed repair atomically
      description: |
        Rechecks every captured version and the account's active state, then
        writes the repair, any confirmed unlinking and the audit in one
        transaction. If the preview requires unlinking, `confirmUnlinking` must
        be true (409 `unlink_confirmation_required`); declining simply means
        not applying. Stale previews return 409 `preview_stale`, expired ones
        410. Re-applying an applied preview returns its recorded result.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRepairRequest"
            examples:
              confirm:
                value: { confirmUnlinking: true }
      responses:
        "200":
          description: Applied (or the recorded result of the earlier apply)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairApplyResult"
              examples:
                applied:
                  $ref: "#/components/examples/ApplyRepair_applied"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                previewStale:
                  $ref: "#/components/examples/Problem_preview_stale"
                unlinkConfirmationRequired:
                  $ref: "#/components/examples/Problem_unlink_confirmation_required"
                reactivationRequired:
                  $ref: "#/components/examples/Problem_reactivation_required"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------- links
  /transfer-pairs:
    post:
      operationId: createTransferPair
      tags: [ links ]
      summary: Confirm two transactions as one transfer
      description: |
        Legs must be active, in different owned accounts, with equal and
        opposite amounts; each transaction can be in only one pair. Different
        posted dates are allowed. A leg that is not yet a `transfer` changes
        type only when `confirmKindChanges` is true (409
        `kind_change_confirmation_required` otherwise); that change on an
        archived account needs reactivation first. Retry-safe via `id`.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferPairRequest"
