                validationFailed:
                  $ref: "#/components/examples/Problem_validation_failed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /transactions/{transactionId}/return-to-rules:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: returnTransactionToRules
      tags: [ transactions ]
      summary: Remove manual protection and let the current rules categorize it
      description: |
        Evaluates the current enabled rules now; with no match the purchase or
        refund becomes Uncategorized with `unassigned` origin. This re-runs
        rules, so on an archived account it returns 409
        `reactivation_required` (rule reapplication skips archived accounts).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Reassigned by rules
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResult"
              examples:
                ruleAssigned:
                  $ref: "#/components/examples/ReturnTransactionToRules_ruleAssigned"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                reactivationRequired:
                  $ref: "#/components/examples/Problem_reactivation_required"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /transactions/{transactionId}/classify:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: classifyTransaction
      tags: [ transactions ]
      summary: Change a transaction's type without changing its amount
      description: |
        Never flips the sign: negative amounts may be `purchase` or `transfer`;
        positive amounts may be `refund`, `income` or `transfer`
        (422 `kind_sign_mismatch` otherwise). Income uses the protected Income
        category; transfers have none; purchase/refund need an explicit
        category choice or a return to rules. If the change invalidates a
        transfer pair or refund links, the exact set must be confirmed in
        `confirmUnlink` (409 `unlink_confirmation_required` lists them).
        Archived accounts return 409 `reactivation_required`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyRequest"
            examples:
              toTransfer:
                $ref: "#/components/examples/ClassifyTransaction_request_toTransfer"
              toPurchase:
                $ref: "#/components/examples/ClassifyTransaction_request_toPurchase"
      responses:
        "200":
          description: Reclassified
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResult"
              examples:
                transfer:
                  $ref: "#/components/examples/ClassifyTransaction_transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                reactivationRequired:
                  $ref: "#/components/examples/Problem_reactivation_required"
                unlinkConfirmationRequired:
                  $ref: "#/components/examples/Problem_unlink_confirmation_required"
                categoryArchived:
                  $ref: "#/components/examples/Problem_category_archived"
        "412":
