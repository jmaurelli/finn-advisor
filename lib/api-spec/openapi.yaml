      responses:
        "200":
          description: Import batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPage"
              examples:
                history:
                  $ref: "#/components/examples/ListImports_history"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequestList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createImport
      tags: [ imports ]
      summary: Upload a bank file into a new preview
      description: |
        `multipart/form-data` with `accountId`, `formatId` and one `file`
        (UTF-8 CSV, optional BOM, at most 10 MiB, 25,000 data rows, 100
        columns, 16 KiB per field; no archives). CSRF is verified before any
        bytes are accepted. Nothing posts and no balance changes until commit.
        An identical file for the same account returns the existing live
        preview or completed outcome (200) instead of a second write.
        Archived accounts return 409 `reactivation_required`. Parsing may
        finish after the response (`status: parsing`); poll the batch.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateImportRequest"
            encoding:
              file:
                contentType: text/csv, application/octet-stream
      responses:
        "200":
          description: Identical file already has a live preview or completed import
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCreateResult"
              examples:
                alreadyCommitted:
                  $ref: "#/components/examples/CreateImport_alreadyCommitted"
        "201":
          description: New preview created
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCreateResult"
              examples:
                created:
                  $ref: "#/components/examples/CreateImport_created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                reactivationRequired:
                  $ref: "#/components/examples/Problem_reactivation_required"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: Semantic validation failed; nothing was saved
