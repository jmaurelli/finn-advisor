openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0-proposed
  summary: The Money Desk private finance API (proposed contract, awaiting owner API approval)
  description: |
    Single-owner, same-origin JSON API for The Money Desk. Implements TDD
    `05-tdd-money-desk.md` sections 2-9. All values in examples are synthetic.

    Shared rules (TDD section 8):
    - Base path `/api`. Every request and response body is JSON unless an
      operation states otherwise. Request objects reject unknown fields.
    - Money is `{ "amountMinor": "<integer cents as a canonical string>", "currency": "USD" }`.
      The canonical integer grammar is `^(0|-?[1-9][0-9]*)$`: no whitespace,
      plus sign, leading zeros, negative zero, fractions or exponents. Stored
      values are bounded below 10^11 cents in absolute value; aggregates
      (balances, totals) use the wider `AggregateMinorUnits` string.
      Spending totals are reported as positive magnitudes; net spending can be
      negative when refunds exceed purchases.
    - Posted dates are validated calendar dates `YYYY-MM-DD` between 1900-01-01
      and 2999-12-31; months are `YYYY-MM`; event times are UTC RFC 3339
      timestamps ending in `Z`. "Today" and "current month" are US Eastern.
    - IDs are UUIDs. For owner-initiated creates the browser generates the ID
      once per intended action: resending the same ID with the same content
      returns the existing record (200); the same ID with different content
      returns 409 `client_id_conflict`.
    - Versions and revisions are integer strings. Single-record reads return a
      strong `ETag` (`"<version>"`). Updates and deletes require `If-Match`;
      a missing header returns 428, a stale one 412.
    - Multi-step commands (repair, rule run, budget change, import commit)
      apply a stored preview. Re-applying an already applied preview returns
      its recorded result without reapplying it.
    - `financeRevision` in list and mutation responses is only a cache hint
      telling the browser which screens to refetch; it never rejects a request.
    - Lists that grow use opaque keyset cursors. A cursor is bound to the
      filters that produced it (400 `cursor_filter_mismatch` otherwise); it
      never expires and is not invalidated by edits.
    - Errors use `application/problem+json` (`Problem`). Any operation may
      also return 500 `internal_error` with a safe message and request ID.
    - Financial, session and export responses carry `Cache-Control: no-store`.
    - Authentication: the `__Host-money_desk_session` cookie. Every write
      except login also needs the per-session `X-CSRF-Token` header and a
      same-origin `Origin`. Reads never extend the idle session deadline.
    - Clients never automatically retry 400/401/403/409/412/422; they may
      retry reads on network failure/503 at most twice, honoring `Retry-After`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: Same-origin base path
security:
  - sessionCookie: []
tags:
  - name: health
    description: Liveness and readiness, no authentication
  - name: session
    description: Owner sign-in, activity and sign-out
  - name: accounts
    description: Accounts, baselines, balances and reconciliation checkpoints
  - name: reports
    description: Period summaries
  - name: transactions
    description: Transaction browsing, categorization, classification and notes
  - name: repairs
    description: Previewed amount/date corrections, void and restore
  - name: links
    description: Transfer pairs and refund links
  - name: categories
    description: Category lifecycle
  - name: rules
    description: Ordered categorization rules and historical rule runs
  - name: budgets
    description: Recurring and monthly category limits
  - name: imports
    description: Bank file upload, preview review and atomic commit
  - name: preferences
    description: Display preferences
  - name: exports
    description: Filtered CSV and full logical JSON downloads
  - name: operations
    description: Backup status read from the backup account's status file

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-money_desk_session
      description: |
        Opaque 256-bit session token; only its hash is stored. Host-only,
        Secure, HttpOnly, SameSite=Strict, Path=/. Expires after 30 minutes
        without owner activity or 12 hours after sign-in.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Per-session token from `GET /session`. Required with a same-origin
        `Origin` on every authenticated write; verified before upload bytes
        are accepted.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Strong ETag of the version the owner saw, e.g. `"4"`. Missing returns
        428 `precondition_required`; stale returns 412 `version_mismatch`.
      schema:
        $ref: "#/components/schemas/ETagValue"
      example: '"4"'
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 20000000-0000-4000-8000-000000000001
    CheckpointId:
      name: checkpointId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 70000000-0000-4000-8000-000000000001
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 10000000-0000-4000-8000-000000000001
    RepairId:
      name: repairId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 80000000-0000-4000-8000-000000000001
    TransferPairId:
      name: transferPairId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 90000000-0000-4000-8000-000000000001
    RefundLinkId:
      name: refundLinkId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 91000000-0000-4000-8000-000000000001
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 30000000-0000-4000-8000-000000000010
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 60000000-0000-4000-8000-000000000001
    RuleRunId:
      name: ruleRunId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 61000000-0000-4000-8000-000000000001
    ImportId:
      name: importId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 40000000-0000-4000-8000-000000000001
    ImportRowId:
      name: rowId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
      example: 41000000-0000-4000-8000-000000000001
    MonthRequired:
      name: month
      in: query
      required: true
      description: Eastern calendar month.
      schema: { $ref: "#/components/schemas/YearMonth" }
      example: "2026-04"
    FilterAccountId:
      name: accountId
      in: query
      schema: { $ref: "#/components/schemas/Uuid" }
    FilterCategoryId:
      name: categoryId
      in: query
      description: Use the Uncategorized category ID to list uncategorized rows.
      schema: { $ref: "#/components/schemas/Uuid" }
    FilterKind:
      name: kind
      in: query
      schema: { $ref: "#/components/schemas/TransactionKind" }
    FilterOrigin:
      name: origin
      in: query
      description: Assignment origin, e.g. `manual`.
      schema: { $ref: "#/components/schemas/AssignmentOrigin" }
    FilterLifecycle:
      name: lifecycle
      in: query
      description: Defaults to `active`. Totals always exclude voided rows.
      schema: { $ref: "#/components/schemas/LifecycleFilter" }
    FilterMonth:
      name: month
      in: query
      description: Posted month. Mutually exclusive with `from`/`to` (400 otherwise).
      schema: { $ref: "#/components/schemas/YearMonth" }
    FilterFrom:
      name: from
      in: query
      description: Inclusive posted-date lower bound.
      schema: { $ref: "#/components/schemas/LocalDate" }
    FilterTo:
      name: to
      in: query
      description: Exclusive posted-date upper bound.
      schema: { $ref: "#/components/schemas/LocalDate" }
    SearchQuery:
      name: q
      in: query
      description: Literal case-insensitive substring of merchant text or note.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: market
    Cursor:
      name: cursor
      in: query
      description: Opaque `nextCursor` from the previous page, used with the same filters.
      schema: { $ref: "#/components/schemas/Cursor" }
    TransactionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    HistoryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  headers:
    ETag:
      description: Strong entity tag of the returned record's version.
      schema: { $ref: "#/components/schemas/ETagValue" }
      example: '"4"'
    Location:
      description: Path of the created resource.
      schema:
        type: string
        format: uri-reference
      example: /api/accounts/20000000-0000-4000-8000-000000000001
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
        maximum: 3600
      example: 2
    NoStore:
      description: Financial, session and export responses are never cached.
      schema:
        type: string
        const: no-store
    SetSessionCookie:
      description: New session cookie; the old session identity is not reused.
      schema:
        type: string
      example: "__Host-money_desk_session=<opaque>; Path=/; Secure; HttpOnly; SameSite=Strict"
    ClearSessionCookie:
      description: Expires the session cookie.
      schema:
        type: string
      example: "__Host-money_desk_session=; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=0"
    CsvDisposition:
      description: Attachment filename for the CSV export.
      schema:
        type: string
      example: 'attachment; filename="money-desk-transactions-2026-05-02.csv"'
    JsonDisposition:
      description: Attachment filename for the JSON export.
      schema:
        type: string
      example: 'attachment; filename="money-desk-ledger-2026-05-02.json"'

  schemas:
    # ------------------------------------------------------------ primitives
    Uuid:
      type: string
      format: uuid
      description: Opaque UUID.
    LocalDate:
      type: string
      format: date
      description: Calendar date `YYYY-MM-DD` between 1900-01-01 and 2999-12-31; impossible dates are rejected.
      pattern: "^(19|2[0-9])[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
    YearMonth:
      type: string
      description: Calendar month `YYYY-MM`.
      pattern: "^(19|2[0-9])[0-9]{2}-(0[1-9]|1[0-2])$"
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 event time.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?Z$"
    EntityVersion:
      type: string
      description: Monotonic record version as a canonical positive integer string below 10^18.
      pattern: "^[1-9][0-9]{0,17}$"
    Revision:
      type: string
      description: Monotonic revision counter as a canonical non-negative integer string below 10^18.
      pattern: "^(0|[1-9][0-9]{0,17})$"
    ETagValue:
      type: string
      description: Strong ETag, the quoted entity version.
      pattern: '^"[1-9][0-9]{0,17}"$'
    Cursor:
      type: string
      description: Opaque keyset cursor bound to the request's filters.
      pattern: "^[A-Za-z0-9_-]{1,512}$"
    Currency:
      type: string
      enum: [ USD ]
    MinorUnits:
      type: string
      description: Signed integer cents, canonical form, absolute value below 10^11.
      pattern: "^(0|-?[1-9][0-9]{0,10})$"
      maxLength: 12
    NonZeroMinorUnits:
      type: string
      description: Signed nonzero integer cents, absolute value below 10^11.
      pattern: "^-?[1-9][0-9]{0,10}$"
      maxLength: 12
    NonNegativeMinorUnits:
      type: string
      description: Non-negative integer cents below 10^11.
      pattern: "^(0|[1-9][0-9]{0,10})$"
      maxLength: 11
    AggregateMinorUnits:
      type: string
      description: Signed integer cents for balances and totals, absolute value below 10^18 (inside the signed 64-bit range).
      pattern: "^(0|-?[1-9][0-9]{0,17})$"
      maxLength: 19
    Money:
      type: object
      additionalProperties: false
      required: [ amountMinor, currency ]
      properties:
        amountMinor: { $ref: "#/components/schemas/MinorUnits" }
        currency: { $ref: "#/components/schemas/Currency" }
    NonZeroMoney:
      type: object
      additionalProperties: false
      required: [ amountMinor, currency ]
      properties:
        amountMinor: { $ref: "#/components/schemas/NonZeroMinorUnits" }
        currency: { $ref: "#/components/schemas/Currency" }
    NonNegativeMoney:
      type: object
      additionalProperties: false
      required: [ amountMinor, currency ]
      properties:
        amountMinor: { $ref: "#/components/schemas/NonNegativeMinorUnits" }
        currency: { $ref: "#/components/schemas/Currency" }
    AggregateMoney:
      type: object
      additionalProperties: false
      required: [ amountMinor, currency ]
      properties:
        amountMinor: { $ref: "#/components/schemas/AggregateMinorUnits" }
        currency: { $ref: "#/components/schemas/Currency" }
    UnlinkSet:
      type: object
      additionalProperties: false
      required: [ transferPairIds, refundLinkIds ]
      properties:
        transferPairIds:
          type: array
          maxItems: 1
          items: { $ref: "#/components/schemas/Uuid" }
        refundLinkIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }

    # ------------------------------------------------------------ problems
    ProblemCode:
      type: string
      enum:
        - invalid_request
        - invalid_cursor
        - cursor_filter_mismatch
        - not_authenticated
        - session_expired
        - invalid_credentials
        - origin_rejected
        - csrf_invalid
        - not_found
        - preview_expired
        - import_contents_deleted
        - client_id_conflict
        - preview_stale
        - reactivation_required
        - account_in_use
        - active_transactions_before_start
        - category_archived
        - category_protected
        - category_in_use
        - category_name_taken
        - rule_set_changed
        - transfer_pair_linked
        - refund_already_linked
        - unlink_confirmation_required
        - kind_change_confirmation_required
        - duplicate_source_identity
        - held_rows_unresolved
        - import_not_open
        - version_mismatch
        - precondition_required
        - validation_failed
        - kind_sign_mismatch
        - month_in_past
        - scope_too_large
        - budget_ineligible_category
        - rule_target_ineligible
        - payload_too_large
        - unsupported_media_type
        - unsupported_file_format
        - login_throttled
        - service_busy
        - maintenance
        - internal_error
    FieldError:
      type: object
      additionalProperties: false
      required: [ path, code, message ]
      properties:
        path:
          type: string
          description: JSON Pointer to the field, or the query/header parameter name.
          maxLength: 200
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        message:
          type: string
          maxLength: 300
    BlockingReference:
      type: object
      additionalProperties: false
      required: [ kind, count, ids ]
      properties:
        kind:
          type: string
          enum: [ transaction, import, checkpoint, rule, transfer_leg, source_identity, budget, import_row ]
        count:
          type: integer
          minimum: 1
        ids:
          type: array
          description: Up to 20 example IDs.
          maxItems: 20
          items: { $ref: "#/components/schemas/Uuid" }
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Never contains SQL, stack traces, raw CSV,
        password material or request payloads.
      additionalProperties: false
      required: [ type, title, status, code, detail, requestId ]
      properties:
        type:
          type: string
          format: uri
          pattern: "^urn:money-desk:problem:[a-z_]+$"
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        code: { $ref: "#/components/schemas/ProblemCode" }
        detail:
          type: string
          maxLength: 500
        requestId: { $ref: "#/components/schemas/Uuid" }
        fieldErrors:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/FieldError" }
        blocking:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/BlockingReference" }
        requiredUnlinks: { $ref: "#/components/schemas/UnlinkSet" }
        currentVersion: { $ref: "#/components/schemas/EntityVersion" }
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 3600

    # ------------------------------------------------------------ service and session
    HealthStatus:
      type: object
      additionalProperties: false
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ ok ]
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [ status, database, schema ]
      properties:
        status:
          type: string
          enum: [ ready, not_ready ]
        database:
          type: string
          enum: [ ok, unavailable ]
        schema:
          type: string
          enum: [ compatible, incompatible, unknown ]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [ password ]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    SignedOutSession:
      type: object
      additionalProperties: false
      required: [ authenticated ]
      properties:
        authenticated:
          type: boolean
          const: false
    SignedInSession:
      type: object
      additionalProperties: false
      required: [ authenticated, csrfToken, displayName, serverTime, idleExpiresAt, absoluteExpiresAt ]
      properties:
        authenticated:
          type: boolean
          const: true
        csrfToken:
          type: string
          description: Send as `X-CSRF-Token` on writes. Memory only; never persist.
          pattern: "^[A-Za-z0-9_-]{43}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        serverTime: { $ref: "#/components/schemas/Timestamp" }
        idleExpiresAt: { $ref: "#/components/schemas/Timestamp" }
        absoluteExpiresAt: { $ref: "#/components/schemas/Timestamp" }
    SessionState:
      oneOf:
        - $ref: "#/components/schemas/SignedOutSession"
        - $ref: "#/components/schemas/SignedInSession"

    # ------------------------------------------------------------ accounts
    AccountKind:
      type: string
      enum: [ checking, savings, credit_card ]
    ProviderKey:
      type: string
      enum: [ chase, campus_usa, bank_of_america, citibank, american_express, capital_one, discover, wells_fargo, other ]
    AccountStatus:
      type: string
      enum: [ active, archived ]
    AccountStatusFilter:
      type: string
      enum: [ active, archived, all ]
      default: active
    ReconciliationStatus:
      type: string
      enum: [ reconciled, needs_recheck, difference, not_checked ]
    AccountReconciliation:
      type: object
      additionalProperties: false
      required: [ latestStatus, needsRecheckCount, differenceCount ]
      properties:
        latestStatus:
          description: Status of the checkpoint with the latest closing date; null when none exist.
          oneOf:
            - $ref: "#/components/schemas/ReconciliationStatus"
            - type: "null"
        needsRecheckCount: { type: integer, minimum: 0 }
        differenceCount: { type: integer, minimum: 0 }
    Account:
      type: object
      additionalProperties: false
      required: [ id, kind, providerKey, displayName, maskedSuffix, trackingStartDate, openingBalance, status, archivedAt, currentBalance, balanceAsOf, lastImportedPostedDate, reconciliation, version, ledgerRevision, createdAt, updatedAt ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { $ref: "#/components/schemas/AccountKind" }
        providerKey: { $ref: "#/components/schemas/ProviderKey" }
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        maskedSuffix:
          type: [ string, "null" ]
          description: Last four digits only; full account numbers are never stored.
          pattern: "^[0-9]{4}$"
        trackingStartDate: { $ref: "#/components/schemas/LocalDate" }
        openingBalance:
          $ref: "#/components/schemas/Money"
        status: { $ref: "#/components/schemas/AccountStatus" }
        archivedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        currentBalance:
          $ref: "#/components/schemas/AggregateMoney"
        balanceAsOf:
          $ref: "#/components/schemas/LocalDate"
        lastImportedPostedDate:
          oneOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
        reconciliation: { $ref: "#/components/schemas/AccountReconciliation" }
        version: { $ref: "#/components/schemas/EntityVersion" }
        ledgerRevision: { $ref: "#/components/schemas/Revision" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    AccountList:
      type: object
      additionalProperties: false
      required: [ items, financeRevision ]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Account" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [ id, kind, providerKey, displayName, trackingStartDate, openingBalance ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { $ref: "#/components/schemas/AccountKind" }
        providerKey: { $ref: "#/components/schemas/ProviderKey" }
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        maskedSuffix:
          type: [ string, "null" ]
          pattern: "^[0-9]{4}$"
        trackingStartDate: { $ref: "#/components/schemas/LocalDate" }
        openingBalance: { $ref: "#/components/schemas/Money" }
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        maskedSuffix:
          type: [ string, "null" ]
          pattern: "^[0-9]{4}$"
        providerKey: { $ref: "#/components/schemas/ProviderKey" }
    AccountResult:
      type: object
      additionalProperties: false
      required: [ account, financeRevision ]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    AccountBalance:
      type: object
      additionalProperties: false
      required: [ accountId, asOf, coverage, balance, trackingStartDate, lastImportedPostedDate, ledgerRevision ]
      properties:
        accountId: { $ref: "#/components/schemas/Uuid" }
        asOf: { $ref: "#/components/schemas/LocalDate" }
        coverage:
          type: string
          enum: [ covered, outside_coverage ]
        balance:
          oneOf:
            - $ref: "#/components/schemas/AggregateMoney"
            - type: "null"
        trackingStartDate: { $ref: "#/components/schemas/LocalDate" }
        lastImportedPostedDate:
          oneOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
        ledgerRevision: { $ref: "#/components/schemas/Revision" }
    CorrectOpeningBalanceRequest:
      type: object
      additionalProperties: false
      required: [ mode, openingBalance ]
      properties:
        mode:
          type: string
          const: correct_opening_balance
        openingBalance: { $ref: "#/components/schemas/Money" }
    MoveStartLaterRequest:
      type: object
      additionalProperties: false
      required: [ mode, trackingStartDate, openingBalance ]
      properties:
        mode:
          type: string
          const: move_start_later
        trackingStartDate: { $ref: "#/components/schemas/LocalDate" }
        openingBalance: { $ref: "#/components/schemas/Money" }
    HeldRowSelection:
      type: object
      additionalProperties: false
      required: [ importId, importVersion, rowIds ]
      properties:
        importId: { $ref: "#/components/schemas/Uuid" }
        importVersion: { $ref: "#/components/schemas/EntityVersion" }
        rowIds:
          type: array
          minItems: 1
          maxItems: 25000
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
    ExtendBackwardRequest:
      type: object
      additionalProperties: false
      required: [ mode, trackingStartDate, openingBalance ]
      properties:
        mode:
          type: string
          const: extend_backward
        trackingStartDate: { $ref: "#/components/schemas/LocalDate" }
        openingBalance: { $ref: "#/components/schemas/Money" }
        heldRows:
          description: Held earlier rows from one open preview to post in the same transaction.
          oneOf:
            - $ref: "#/components/schemas/HeldRowSelection"
            - type: "null"
    BaselineChangeRequest:
      oneOf:
        - $ref: "#/components/schemas/CorrectOpeningBalanceRequest"
        - $ref: "#/components/schemas/MoveStartLaterRequest"
        - $ref: "#/components/schemas/ExtendBackwardRequest"
      discriminator:
        propertyName: mode
        mapping:
          correct_opening_balance: "#/components/schemas/CorrectOpeningBalanceRequest"
          move_start_later: "#/components/schemas/MoveStartLaterRequest"
          extend_backward: "#/components/schemas/ExtendBackwardRequest"
    BaselineChangeResult:
      type: object
      additionalProperties: false
      required: [ account, postedTransactionIds, financeRevision ]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        postedTransactionIds:
          type: array
          maxItems: 25000
          items: { $ref: "#/components/schemas/Uuid" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    CheckpointCheck:
      type: object
      additionalProperties: false
      required: [ id, checkedAt, calculatedBalance, matched, difference ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        checkedAt: { $ref: "#/components/schemas/Timestamp" }
        calculatedBalance: { $ref: "#/components/schemas/AggregateMoney" }
        matched: { type: boolean }
        difference:
          description: Calculated minus statement balance.
          $ref: "#/components/schemas/AggregateMoney"
    Checkpoint:
      type: object
      additionalProperties: false
      required: [ id, accountId, closingDate, statementBalance, status, latestCheck, currentCalculatedBalance, currentDifference, version, createdAt ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        accountId: { $ref: "#/components/schemas/Uuid" }
        closingDate: { $ref: "#/components/schemas/LocalDate" }
        statementBalance: { $ref: "#/components/schemas/Money" }
        status:
          description: Derived on read, never stored.
          $ref: "#/components/schemas/ReconciliationStatus"
        latestCheck:
          oneOf:
            - $ref: "#/components/schemas/CheckpointCheck"
            - type: "null"
        currentCalculatedBalance:
          description: Null when the closing date is before the tracking start.
          oneOf:
            - $ref: "#/components/schemas/AggregateMoney"
            - type: "null"
        currentDifference:
          oneOf:
            - $ref: "#/components/schemas/AggregateMoney"
            - type: "null"
        version: { $ref: "#/components/schemas/EntityVersion" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    CheckpointList:
      type: object
      additionalProperties: false
      required: [ items, financeRevision ]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Checkpoint" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    CreateCheckpointRequest:
      type: object
      additionalProperties: false
      required: [ id, closingDate, statementBalance ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        closingDate: { $ref: "#/components/schemas/LocalDate" }
        statementBalance: { $ref: "#/components/schemas/Money" }
    CheckpointResult:
      type: object
      additionalProperties: false
      required: [ checkpoint, financeRevision ]
      properties:
        checkpoint: { $ref: "#/components/schemas/Checkpoint" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    CheckpointHistory:
      type: object
      additionalProperties: false
      required: [ checkpointId, accountId, closingDate, statementBalance, checks ]
      properties:
        checkpointId: { $ref: "#/components/schemas/Uuid" }
        accountId: { $ref: "#/components/schemas/Uuid" }
        closingDate: { $ref: "#/components/schemas/LocalDate" }
        statementBalance: { $ref: "#/components/schemas/Money" }
        checks:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/CheckpointCheck" }

    # ------------------------------------------------------------ reports
    SpendingTotals:
      type: object
      additionalProperties: false
      required: [ purchases, refunds, net ]
      properties:
        purchases:
          description: Magnitude of purchases (positive).
          $ref: "#/components/schemas/AggregateMoney"
        refunds:
          description: Magnitude of refunds (positive).
          $ref: "#/components/schemas/AggregateMoney"
        net:
          description: Purchases minus refunds; negative when refunds exceed purchases.
          $ref: "#/components/schemas/AggregateMoney"
    CategorySpending:
      type: object
      additionalProperties: false
      required: [ categoryId, purchases, refunds, net, transactionCount ]
      properties:
        categoryId: { $ref: "#/components/schemas/Uuid" }
        purchases: { $ref: "#/components/schemas/AggregateMoney" }
        refunds: { $ref: "#/components/schemas/AggregateMoney" }
        net: { $ref: "#/components/schemas/AggregateMoney" }
        transactionCount: { type: integer, minimum: 0 }
    AccountMonthBalance:
      type: object
      additionalProperties: false
      required: [ accountId, balance, coverage ]
      properties:
        accountId: { $ref: "#/components/schemas/Uuid" }
        balance:
          description: Balance at month end, or today for the current month.
          oneOf:
            - $ref: "#/components/schemas/AggregateMoney"
            - type: "null"
        coverage:
          type: string
          enum: [ covered, outside_coverage ]
    ReviewCounts:
      type: object
      additionalProperties: false
      required: [ uncategorizedCount, openImportCount, heldImportRowCount, needsRecheckCount, differenceCount, unmatchedTransferCount ]
      properties:
        uncategorizedCount:
          description: Active purchases/refunds in Uncategorized, all months.
          type: integer
          minimum: 0
        openImportCount: { type: integer, minimum: 0 }
        heldImportRowCount: { type: integer, minimum: 0 }
        needsRecheckCount: { type: integer, minimum: 0 }
        differenceCount: { type: integer, minimum: 0 }
        unmatchedTransferCount: { type: integer, minimum: 0 }
    MonthSummary:
      type: object
      additionalProperties: false
      required: [ month, asOf, spending, income, categories, uncategorized, accounts, review, financeRevision ]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        asOf:
          description: Eastern date the summary was computed for.
          $ref: "#/components/schemas/LocalDate"
        spending: { $ref: "#/components/schemas/SpendingTotals" }
        income: { $ref: "#/components/schemas/AggregateMoney" }
        categories:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/CategorySpending" }
        uncategorized:
          type: object
          additionalProperties: false
          required: [ net, transactionCount ]
          properties:
            net: { $ref: "#/components/schemas/AggregateMoney" }
            transactionCount: { type: integer, minimum: 0 }
        accounts:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/AccountMonthBalance" }
        review: { $ref: "#/components/schemas/ReviewCounts" }
        financeRevision: { $ref: "#/components/schemas/Revision" }

    # ------------------------------------------------------------ transactions
    TransactionKind:
      type: string
      enum: [ purchase, refund, income, transfer ]
    AssignmentOrigin:
      type: string
      enum: [ manual, rule, unassigned, system ]
    Lifecycle:
      type: string
      enum: [ active, void ]
    LifecycleFilter:
      type: string
      enum: [ active, void, all ]
      default: active
    Assignment:
      type: object
      additionalProperties: false
      required: [ origin, assignedAt, ruleId, ruleRevision ]
      properties:
        origin: { $ref: "#/components/schemas/AssignmentOrigin" }
        assignedAt: { $ref: "#/components/schemas/Timestamp" }
        ruleId:
          type: [ string, "null" ]
          format: uuid
        ruleRevision:
          type: [ string, "null" ]
          pattern: "^[1-9][0-9]{0,17}$"
    RefundLinkRef:
      type: object
      additionalProperties: false
      required: [ linkId, purchaseId ]
      properties:
        linkId: { $ref: "#/components/schemas/Uuid" }
        purchaseId: { $ref: "#/components/schemas/Uuid" }
    TransactionCorrection:
      type: object
      additionalProperties: false
      description: Original imported values, present once a repair changed amount or date.
      required: [ originalPostedDate, originalMoney ]
      properties:
        originalPostedDate: { $ref: "#/components/schemas/LocalDate" }
        originalMoney: { $ref: "#/components/schemas/NonZeroMoney" }
    Transaction:
      type: object
      additionalProperties: false
      required: [ id, accountId, postedDate, merchant, money, kind, lifecycle, categoryId, assignment, note, importId, sourceRowNumber, transferPairId, refundLink, linkedRefundCount, correction, voidedAt, version, createdAt, updatedAt ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        accountId: { $ref: "#/components/schemas/Uuid" }
        postedDate: { $ref: "#/components/schemas/LocalDate" }
        merchant:
          type: string
          description: Original bank description, unchanged.
          minLength: 1
          maxLength: 2000
        money:
          description: Signed movement; purchases negative, refunds and income positive, transfers either.
          $ref: "#/components/schemas/NonZeroMoney"
        kind: { $ref: "#/components/schemas/TransactionKind" }
        lifecycle: { $ref: "#/components/schemas/Lifecycle" }
        categoryId:
          type: [ string, "null" ]
          format: uuid
          description: Null only for transfers.
        assignment: { $ref: "#/components/schemas/Assignment" }
        note:
          type: [ string, "null" ]
          maxLength: 1000
        importId:
          type: [ string, "null" ]
          format: uuid
        sourceRowNumber:
          type: [ integer, "null" ]
          minimum: 1
        transferPairId:
          type: [ string, "null" ]
          format: uuid
        refundLink:
          description: For refunds linked to a purchase.
          oneOf:
            - $ref: "#/components/schemas/RefundLinkRef"
            - type: "null"
        linkedRefundCount:
          description: For purchases, how many refunds link to it.
          type: integer
          minimum: 0
        correction:
          oneOf:
            - $ref: "#/components/schemas/TransactionCorrection"
            - type: "null"
        voidedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        version: { $ref: "#/components/schemas/EntityVersion" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    ScopeTotals:
      type: object
      additionalProperties: false
      description: Totals over every row matching the filters; voided rows never contribute money.
      required: [ matchingCount, purchases, refunds, netSpending, income ]
      properties:
        matchingCount: { type: integer, minimum: 0 }
        purchases: { $ref: "#/components/schemas/AggregateMoney" }
        refunds: { $ref: "#/components/schemas/AggregateMoney" }
        netSpending: { $ref: "#/components/schemas/AggregateMoney" }
        income: { $ref: "#/components/schemas/AggregateMoney" }
    TransactionPage:
      type: object
      additionalProperties: false
      required: [ items, nextCursor, totals, financeRevision ]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        totals: { $ref: "#/components/schemas/ScopeTotals" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    TransactionResult:
      type: object
      additionalProperties: false
      required: [ transaction, financeRevision ]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    NewRuleFromCorrection:
      type: object
      additionalProperties: false
      required: [ id, matchType, pattern, appliesTo, accountId ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        matchType: { $ref: "#/components/schemas/RuleMatchType" }
        pattern: { $ref: "#/components/schemas/RulePattern" }
        appliesTo: { $ref: "#/components/schemas/RuleAppliesTo" }
        accountId:
          type: [ string, "null" ]
          format: uuid
    CategorizeRequest:
      type: object
      additionalProperties: false
      required: [ categoryId ]
      properties:
        categoryId: { $ref: "#/components/schemas/Uuid" }
        newRule:
          description: Optional rule created in the same save, targeting `categoryId`.
          $ref: "#/components/schemas/NewRuleFromCorrection"
    CategorizeResult:
      type: object
      additionalProperties: false
      required: [ transaction, rule, ruleOverlaps, ruleSetRevision, financeRevision ]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        rule:
          oneOf:
            - $ref: "#/components/schemas/Rule"
            - type: "null"
        ruleOverlaps:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RuleOverlap" }
        ruleSetRevision: { $ref: "#/components/schemas/Revision" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    CategoryChoiceCategory:
      type: object
      additionalProperties: false
      required: [ mode, categoryId ]
      properties:
        mode:
          type: string
          const: category
        categoryId: { $ref: "#/components/schemas/Uuid" }
    CategoryChoiceRules:
      type: object
      additionalProperties: false
      required: [ mode ]
      properties:
        mode:
          type: string
          const: rules
    CategoryChoice:
      description: An explicit category (manual) or letting the rules decide.
      oneOf:
        - $ref: "#/components/schemas/CategoryChoiceCategory"
        - $ref: "#/components/schemas/CategoryChoiceRules"
      discriminator:
        propertyName: mode
        mapping:
          category: "#/components/schemas/CategoryChoiceCategory"
          rules: "#/components/schemas/CategoryChoiceRules"
    ClassifyRequest:
      type: object
      additionalProperties: false
      required: [ kind ]
      properties:
        kind: { $ref: "#/components/schemas/TransactionKind" }
        category:
          description: Required when the new kind is purchase or refund; forbidden otherwise.
          $ref: "#/components/schemas/CategoryChoice"
        confirmUnlink:
          description: Exactly the links the change invalidates, confirming their removal.
          $ref: "#/components/schemas/UnlinkSet"
    ClassifyResult:
      type: object
      additionalProperties: false
      required: [ transaction, unlinked, financeRevision ]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        unlinked: { $ref: "#/components/schemas/UnlinkSet" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    UpdateNoteRequest:
      type: object
      additionalProperties: false
      required: [ note ]
      properties:
        note:
          type: [ string, "null" ]
          minLength: 1
          maxLength: 1000
    HistorySnapshot:
      type: object
      additionalProperties: false
      properties:
        categoryId:
          type: [ string, "null" ]
          format: uuid
        categoryName:
          type: [ string, "null" ]
          description: Name at the time of the event.
          maxLength: 60
        assignmentOrigin: { $ref: "#/components/schemas/AssignmentOrigin" }
        kind: { $ref: "#/components/schemas/TransactionKind" }
        lifecycle: { $ref: "#/components/schemas/Lifecycle" }
        postedDate: { $ref: "#/components/schemas/LocalDate" }
        money: { $ref: "#/components/schemas/NonZeroMoney" }
        note:
          type: [ string, "null" ]
          maxLength: 1000
    HistoryEvent:
      type: object
      additionalProperties: false
      required: [ id, transactionId, occurredAt, eventType, source, reason, before, after, ruleId, ruleRevision, relatedIds ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        transactionId: { $ref: "#/components/schemas/Uuid" }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        eventType:
          type: string
          enum: [ imported, category_changed, returned_to_rules, kind_changed, note_changed, amount_corrected, date_corrected, voided, restored, transfer_linked, transfer_unlinked, refund_linked, refund_unlinked ]
        source:
          type: string
          enum: [ owner, rule_run, import, system ]
        reason:
          type: [ string, "null" ]
          maxLength: 500
        before:
          oneOf:
            - $ref: "#/components/schemas/HistorySnapshot"
            - type: "null"
        after:
          oneOf:
            - $ref: "#/components/schemas/HistorySnapshot"
            - type: "null"
        ruleId:
          type: [ string, "null" ]
          format: uuid
        ruleRevision:
          type: [ string, "null" ]
          pattern: "^[1-9][0-9]{0,17}$"
        relatedIds:
          description: Linked records, repair preview, rule run or import involved.
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Uuid" }
    HistoryPage:
      type: object
      additionalProperties: false
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/HistoryEvent" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"

    # ------------------------------------------------------------ repairs
    CorrectRepairRequest:
      type: object
      additionalProperties: false
      description: At least one of `postedDate` or `money` (422 otherwise).
      required: [ action, reason ]
      properties:
        action:
          type: string
          const: correct
        reason: { $ref: "#/components/schemas/RepairReason" }
        postedDate: { $ref: "#/components/schemas/LocalDate" }
        money: { $ref: "#/components/schemas/NonZeroMoney" }
    VoidRepairRequest:
      type: object
      additionalProperties: false
      required: [ action, reason ]
      properties:
        action:
          type: string
          const: void
        reason: { $ref: "#/components/schemas/RepairReason" }
    RestoreRepairRequest:
      type: object
      additionalProperties: false
      required: [ action, reason ]
      properties:
        action:
          type: string
          const: restore
        reason: { $ref: "#/components/schemas/RepairReason" }
    RepairRequest:
      oneOf:
        - $ref: "#/components/schemas/CorrectRepairRequest"
        - $ref: "#/components/schemas/VoidRepairRequest"
        - $ref: "#/components/schemas/RestoreRepairRequest"
      discriminator:
        propertyName: action
        mapping:
          correct: "#/components/schemas/CorrectRepairRequest"
          void: "#/components/schemas/VoidRepairRequest"
          restore: "#/components/schemas/RestoreRepairRequest"
    RepairReason:
      type: string
      minLength: 1
      maxLength: 500
    RepairState:
      type: object
      additionalProperties: false
      required: [ postedDate, money, lifecycle ]
      properties:
        postedDate: { $ref: "#/components/schemas/LocalDate" }
        money: { $ref: "#/components/schemas/NonZeroMoney" }
        lifecycle: { $ref: "#/components/schemas/Lifecycle" }
    BalanceChange:
      type: object
      additionalProperties: false
      required: [ accountId, effectiveFrom, delta ]
      properties:
        accountId: { $ref: "#/components/schemas/Uuid" }
        effectiveFrom: { $ref: "#/components/schemas/LocalDate" }
        delta: { $ref: "#/components/schemas/AggregateMoney" }
    CheckpointImpact:
      type: object
      additionalProperties: false
      required: [ checkpointId, closingDate, balanceBefore, balanceAfter, statusAfter ]
      properties:
        checkpointId: { $ref: "#/components/schemas/Uuid" }
        closingDate: { $ref: "#/components/schemas/LocalDate" }
        balanceBefore: { $ref: "#/components/schemas/AggregateMoney" }
        balanceAfter: { $ref: "#/components/schemas/AggregateMoney" }
        statusAfter: { $ref: "#/components/schemas/ReconciliationStatus" }
    RepairImpact:
      type: object
      additionalProperties: false
      required: [ balanceChanges, affectedMonths, affectedCheckpoints, requiredUnlinks ]
      properties:
        balanceChanges:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/BalanceChange" }
        affectedMonths:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/YearMonth" }
        affectedCheckpoints:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/CheckpointImpact" }
        requiredUnlinks: { $ref: "#/components/schemas/UnlinkSet" }
    CapturedVersion:
      type: object
      additionalProperties: false
      required: [ entity, id, version ]
      properties:
        entity:
          type: string
          enum: [ transaction, account, transfer_pair, refund_link ]
        id: { $ref: "#/components/schemas/Uuid" }
        version: { $ref: "#/components/schemas/EntityVersion" }
    PreviewStatus:
      type: string
      enum: [ ready, applied, stale, expired ]
    RepairPreview:
      type: object
      additionalProperties: false
      required: [ id, transactionId, accountId, action, reason, status, before, after, impact, capturedVersions, createdAt, expiresAt, appliedAt ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        transactionId: { $ref: "#/components/schemas/Uuid" }
        accountId: { $ref: "#/components/schemas/Uuid" }
        action:
          type: string
          enum: [ correct, void, restore ]
        reason: { $ref: "#/components/schemas/RepairReason" }
        status: { $ref: "#/components/schemas/PreviewStatus" }
        before: { $ref: "#/components/schemas/RepairState" }
        after: { $ref: "#/components/schemas/RepairState" }
        impact: { $ref: "#/components/schemas/RepairImpact" }
        capturedVersions:
          type: array
          maxItems: 510
          items: { $ref: "#/components/schemas/CapturedVersion" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        appliedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    ApplyRepairRequest:
      type: object
      additionalProperties: false
      required: [ confirmUnlinking ]
      properties:
        confirmUnlinking:
          type: boolean
          description: Must be true when the preview lists required unlinks.
    RepairApplyResult:
      type: object
      additionalProperties: false
      required: [ repair, transaction, unlinked, financeRevision ]
      properties:
        repair: { $ref: "#/components/schemas/RepairPreview" }
        transaction: { $ref: "#/components/schemas/Transaction" }
        unlinked: { $ref: "#/components/schemas/UnlinkSet" }
        financeRevision: { $ref: "#/components/schemas/Revision" }

    # ------------------------------------------------------------ links
    TransferLeg:
      type: object
      additionalProperties: false
      required: [ transactionId, accountId, postedDate, money ]
      properties:
        transactionId: { $ref: "#/components/schemas/Uuid" }
        accountId: { $ref: "#/components/schemas/Uuid" }
        postedDate: { $ref: "#/components/schemas/LocalDate" }
        money: { $ref: "#/components/schemas/NonZeroMoney" }
    TransferPair:
      type: object
      additionalProperties: false
      required: [ id, legs, createdAt, version ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        legs:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/TransferLeg" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        version: { $ref: "#/components/schemas/EntityVersion" }
    VersionedTransactionRef:
      type: object
      additionalProperties: false
      required: [ transactionId, version ]
      properties:
        transactionId: { $ref: "#/components/schemas/Uuid" }
        version: { $ref: "#/components/schemas/EntityVersion" }
    CreateTransferPairRequest:
      type: object
      additionalProperties: false
      required: [ id, legs, confirmKindChanges ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        legs:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/VersionedTransactionRef" }
        confirmKindChanges:
          type: boolean
          description: Confirms changing a non-transfer leg's type to `transfer`.
    TransferPairResult:
      type: object
      additionalProperties: false
      required: [ transferPair, transactions, financeRevision ]
      properties:
        transferPair: { $ref: "#/components/schemas/TransferPair" }
        transactions:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/Transaction" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    UnlinkResult:
      type: object
      additionalProperties: false
      required: [ transactionIds, financeRevision ]
      properties:
        transactionIds:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/Uuid" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    TransferCandidate:
      type: object
      additionalProperties: false
      required: [ transaction, daysApart, withinSuggestionWindow, requiresKindChange, eligible, ineligibleReason ]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        daysApart: { type: integer, minimum: 0 }
        withinSuggestionWindow: { type: boolean }
        requiresKindChange: { type: boolean }
        eligible: { type: boolean }
        ineligibleReason:
          type: [ string, "null" ]
          enum: [ already_paired, reactivation_required, same_account, amount_mismatch, voided, null ]
    TransferCandidateList:
      type: object
      additionalProperties: false
      required: [ items, financeRevision ]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/TransferCandidate" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    RefundLink:
      type: object
      additionalProperties: false
      required: [ id, refundId, purchaseId, createdAt, version ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        refundId: { $ref: "#/components/schemas/Uuid" }
        purchaseId: { $ref: "#/components/schemas/Uuid" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        version: { $ref: "#/components/schemas/EntityVersion" }
    CreateRefundLinkRequest:
      type: object
      additionalProperties: false
      required: [ id, refundId, purchaseId ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        refundId: { $ref: "#/components/schemas/Uuid" }
        purchaseId: { $ref: "#/components/schemas/Uuid" }
    RefundLinkResult:
      type: object
      additionalProperties: false
      required: [ refundLink, linkedRefundTotal, exceedsPurchase, financeRevision ]
      properties:
        refundLink: { $ref: "#/components/schemas/RefundLink" }
        linkedRefundTotal:
          description: All refunds now linked to the purchase (positive).
          $ref: "#/components/schemas/AggregateMoney"
        exceedsPurchase:
          type: boolean
          description: Warning only; the link was still saved.
        financeRevision: { $ref: "#/components/schemas/Revision" }
    RefundCandidate:
      type: object
      additionalProperties: false
      required: [ transaction, linkedRefundTotal, wouldExceedPurchase ]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        linkedRefundTotal: { $ref: "#/components/schemas/AggregateMoney" }
        wouldExceedPurchase: { type: boolean }
    RefundCandidatePage:
      type: object
      additionalProperties: false
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/RefundCandidate" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"

    # ------------------------------------------------------------ categories
    CategoryStatus:
      type: string
      enum: [ active, archived ]
    CategoryStatusFilter:
      type: string
      enum: [ active, archived, all ]
      default: active
    CategoryName:
      type: string
      description: Unique after trimming, collapsing spaces and ignoring case.
      minLength: 1
      maxLength: 60
      pattern: "\\S"
    CategoryColor:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
    Category:
      type: object
      additionalProperties: false
      required: [ id, name, description, color, systemKind, protected, status, archivedAt, version, createdAt, updatedAt ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { $ref: "#/components/schemas/CategoryName" }
        description:
          type: [ string, "null" ]
          maxLength: 280
        color: { $ref: "#/components/schemas/CategoryColor" }
        systemKind:
          type: [ string, "null" ]
          enum: [ income, uncategorized, null ]
        protected: { type: boolean }
        status: { $ref: "#/components/schemas/CategoryStatus" }
        archivedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        version: { $ref: "#/components/schemas/EntityVersion" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    CategoryList:
      type: object
      additionalProperties: false
      required: [ items, financeRevision ]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Category" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [ id, name, color ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { $ref: "#/components/schemas/CategoryName" }
        description:
          type: [ string, "null" ]
          maxLength: 280
        color: { $ref: "#/components/schemas/CategoryColor" }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: "#/components/schemas/CategoryName" }
        description:
          type: [ string, "null" ]
          maxLength: 280
        color: { $ref: "#/components/schemas/CategoryColor" }
    CategoryResult:
      type: object
      additionalProperties: false
      required: [ category, financeRevision ]
      properties:
        category: { $ref: "#/components/schemas/Category" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    BudgetEntry:
      type: object
      additionalProperties: false
      required: [ entryType, month, state, amount ]
      properties:
        entryType:
          type: string
          enum: [ regular, monthly ]
        month: { $ref: "#/components/schemas/YearMonth" }
        state:
          type: string
          enum: [ amount, stopped, skip ]
        amount:
          oneOf:
            - $ref: "#/components/schemas/NonNegativeMoney"
            - type: "null"
    ArchiveImpactRule:
      type: object
      additionalProperties: false
      required: [ ruleId, position, matchType, pattern, enabled, version ]
      properties:
        ruleId: { $ref: "#/components/schemas/Uuid" }
        position: { type: integer, minimum: 1 }
        matchType: { $ref: "#/components/schemas/RuleMatchType" }
        pattern: { $ref: "#/components/schemas/RulePattern" }
        enabled:
          description: Only enabled rules need a resolution before archiving.
          type: boolean
        version: { $ref: "#/components/schemas/EntityVersion" }
    CategoryArchiveImpact:
      type: object
      additionalProperties: false
      required: [ categoryId, categoryVersion, ruleSetRevision, activeRules, budget ]
      properties:
        categoryId: { $ref: "#/components/schemas/Uuid" }
        categoryVersion: { $ref: "#/components/schemas/EntityVersion" }
        ruleSetRevision: { $ref: "#/components/schemas/Revision" }
        activeRules:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ArchiveImpactRule" }
        budget:
          type: object
          additionalProperties: false
          required: [ planVersion, cutoffMonth, currentMonthLimit, removedEntries ]
          properties:
            planVersion:
              type: [ string, "null" ]
              pattern: "^[1-9][0-9]{0,17}$"
            cutoffMonth:
              description: First month without a budget (next Eastern month).
              $ref: "#/components/schemas/YearMonth"
            currentMonthLimit:
              oneOf:
                - $ref: "#/components/schemas/NonNegativeMoney"
                - type: "null"
            removedEntries:
              type: array
              maxItems: 1000
              items: { $ref: "#/components/schemas/BudgetEntry" }
    RuleResolution:
      type: object
      additionalProperties: false
      required: [ ruleId, action, targetCategoryId ]
      properties:
        ruleId: { $ref: "#/components/schemas/Uuid" }
        action:
          type: string
          enum: [ disable, retarget ]
        targetCategoryId:
          description: Required for `retarget` (an active expense category); null for `disable`.
          type: [ string, "null" ]
          format: uuid
    ArchiveCategoryRequest:
      type: object
      additionalProperties: false
      required: [ ruleSetRevision, budgetPlanVersion, ruleResolutions ]
      properties:
        ruleSetRevision: { $ref: "#/components/schemas/Revision" }
        budgetPlanVersion:
          type: [ string, "null" ]
          pattern: "^[1-9][0-9]{0,17}$"
        ruleResolutions:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/RuleResolution" }
    ArchiveCategoryResult:
      type: object
      additionalProperties: false
      required: [ category, rulesChanged, ruleSetRevision, budgetPlan, financeRevision ]
      properties:
        category: { $ref: "#/components/schemas/Category" }
        rulesChanged:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Rule" }
        ruleSetRevision: { $ref: "#/components/schemas/Revision" }
        budgetPlan:
          oneOf:
            - $ref: "#/components/schemas/BudgetPlan"
            - type: "null"
        financeRevision: { $ref: "#/components/schemas/Revision" }

    # ------------------------------------------------------------ rules
    RuleMatchType:
      type: string
      description: Compared after NFKC, trimming, space collapsing and lowercasing.
      enum: [ contains, exact ]
    RulePattern:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "\\S"
    RuleAppliesTo:
      type: string
      enum: [ purchases_and_refunds, purchases, refunds ]
    RuleStatus:
      type: string
      enum: [ active, archived ]
    RuleStatusFilter:
      type: string
      enum: [ active, archived, all ]
      default: active
    Rule:
      type: object
      additionalProperties: false
      required: [ id, position, revision, matchType, pattern, accountId, appliesTo, categoryId, enabled, status, currentAssignmentCount, version, createdAt, updatedAt ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        position:
          description: 1-based priority among active rules; null when archived.
          type: [ integer, "null" ]
          minimum: 1
        revision:
          type: string
          pattern: "^[1-9][0-9]{0,17}$"
        matchType: { $ref: "#/components/schemas/RuleMatchType" }
        pattern: { $ref: "#/components/schemas/RulePattern" }
        accountId:
          description: Null applies to all accounts.
          type: [ string, "null" ]
          format: uuid
        appliesTo: { $ref: "#/components/schemas/RuleAppliesTo" }
        categoryId: { $ref: "#/components/schemas/Uuid" }
        enabled: { type: boolean }
        status: { $ref: "#/components/schemas/RuleStatus" }
        currentAssignmentCount: { type: integer, minimum: 0 }
        version: { $ref: "#/components/schemas/EntityVersion" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    RuleList:
      type: object
      additionalProperties: false
      required: [ items, ruleSetRevision, financeRevision ]
      properties:
        items:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/Rule" }
        ruleSetRevision: { $ref: "#/components/schemas/Revision" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    CreateRuleRequest:
      type: object
      additionalProperties: false
      required: [ id, matchType, pattern, categoryId ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        matchType: { $ref: "#/components/schemas/RuleMatchType" }
        pattern: { $ref: "#/components/schemas/RulePattern" }
        accountId:
          type: [ string, "null" ]
          format: uuid
        appliesTo:
          description: Omitted means `purchases_and_refunds` (applied by the server, not by a schema default).
          $ref: "#/components/schemas/RuleAppliesTo"
        categoryId: { $ref: "#/components/schemas/Uuid" }
        enabled:
          description: Omitted means true.
          type: boolean
    UpdateRuleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        matchType: { $ref: "#/components/schemas/RuleMatchType" }
        pattern: { $ref: "#/components/schemas/RulePattern" }
        accountId:
          type: [ string, "null" ]
          format: uuid
        appliesTo: { $ref: "#/components/schemas/RuleAppliesTo" }
        categoryId: { $ref: "#/components/schemas/Uuid" }
        enabled: { type: boolean }
    RuleOverlap:
      type: object
      additionalProperties: false
      required: [ ruleId, position, reason ]
      properties:
        ruleId: { $ref: "#/components/schemas/Uuid" }
        position: { type: integer, minimum: 1 }
        reason:
          type: string
          enum: [ same_match, broader_earlier, narrower_later ]
    RuleResult:
      type: object
      additionalProperties: false
      required: [ rule, overlaps, ruleSetRevision, financeRevision ]
      properties:
        rule: { $ref: "#/components/schemas/Rule" }
        overlaps:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RuleOverlap" }
        ruleSetRevision: { $ref: "#/components/schemas/Revision" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    ReorderRulesRequest:
      type: object
      additionalProperties: false
      required: [ ruleSetRevision, orderedRuleIds ]
      properties:
        ruleSetRevision: { $ref: "#/components/schemas/Revision" }
        orderedRuleIds:
          type: array
          minItems: 1
          maxItems: 2000
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
    RuleRevisionRecord:
      type: object
      additionalProperties: false
      required: [ revision, change, changedAt, matchType, pattern, accountId, appliesTo, categoryId, categoryNameAtRevision, enabled ]
      properties:
        revision:
          type: string
          pattern: "^[1-9][0-9]{0,17}$"
        change:
          type: string
          enum: [ created, edited, enabled, disabled, retargeted, archived ]
        changedAt: { $ref: "#/components/schemas/Timestamp" }
        matchType: { $ref: "#/components/schemas/RuleMatchType" }
        pattern: { $ref: "#/components/schemas/RulePattern" }
        accountId:
          type: [ string, "null" ]
          format: uuid
        appliesTo: { $ref: "#/components/schemas/RuleAppliesTo" }
        categoryId: { $ref: "#/components/schemas/Uuid" }
        categoryNameAtRevision: { $ref: "#/components/schemas/CategoryName" }
        enabled: { type: boolean }
    RuleHistory:
      type: object
      additionalProperties: false
      required: [ ruleId, revisions ]
      properties:
        ruleId: { $ref: "#/components/schemas/Uuid" }
        revisions:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/RuleRevisionRecord" }
    RuleRunScope:
      type: object
      additionalProperties: false
      description: All fields AND together; `month` excludes `from`/`to`.
      required: [ accountId, categoryId, month, from, to ]
      properties:
        accountId:
          type: [ string, "null" ]
          format: uuid
        categoryId:
          type: [ string, "null" ]
          format: uuid
        month:
          type: [ string, "null" ]
          pattern: "^(19|2[0-9])[0-9]{2}-(0[1-9]|1[0-2])$"
        from:
          oneOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
        to:
          oneOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
    CreateRuleRunRequest:
      type: object
      additionalProperties: false
      required: [ scope ]
      properties:
        scope: { $ref: "#/components/schemas/RuleRunScope" }
    RuleRunCounts:
      type: object
      additionalProperties: false
      required: [ candidates, changes, toUncategorized, manualSkipped ]
      properties:
        candidates: { type: integer, minimum: 0, maximum: 25000 }
        changes: { type: integer, minimum: 0 }
        toUncategorized: { type: integer, minimum: 0 }
        manualSkipped: { type: integer, minimum: 0 }
    RuleRun:
      type: object
      additionalProperties: false
      required: [ id, status, scope, ruleSetRevision, counts, createdAt, expiresAt, appliedAt, changedCount ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/PreviewStatus" }
        scope: { $ref: "#/components/schemas/RuleRunScope" }
        ruleSetRevision: { $ref: "#/components/schemas/Revision" }
        counts: { $ref: "#/components/schemas/RuleRunCounts" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        appliedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        changedCount:
          description: Rows actually changed when applied; null until applied.
          type: [ integer, "null" ]
          minimum: 0
    RuleRunApplyResult:
      type: object
      additionalProperties: false
      required: [ ruleRun, financeRevision ]
      properties:
        ruleRun: { $ref: "#/components/schemas/RuleRun" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    AssignmentState:
      type: object
      additionalProperties: false
      required: [ categoryId, origin, ruleId, ruleRevision ]
      properties:
        categoryId: { $ref: "#/components/schemas/Uuid" }
        origin: { $ref: "#/components/schemas/AssignmentOrigin" }
        ruleId:
          type: [ string, "null" ]
          format: uuid
        ruleRevision:
          type: [ string, "null" ]
          pattern: "^[1-9][0-9]{0,17}$"
    RuleRunRow:
      type: object
      additionalProperties: false
      required: [ transactionId, postedDate, merchant, money, before, after ]
      properties:
        transactionId: { $ref: "#/components/schemas/Uuid" }
        postedDate: { $ref: "#/components/schemas/LocalDate" }
        merchant:
          type: string
          maxLength: 2000
        money: { $ref: "#/components/schemas/NonZeroMoney" }
        before: { $ref: "#/components/schemas/AssignmentState" }
        after: { $ref: "#/components/schemas/AssignmentState" }
    RuleRunRowPage:
      type: object
      additionalProperties: false
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/RuleRunRow" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"

    # ------------------------------------------------------------ budgets
    BudgetLine:
      type: object
      additionalProperties: false
      required: [ categoryId, limit, source, purchases, refunds, net, remaining, percentUsed, planVersion ]
      properties:
        categoryId: { $ref: "#/components/schemas/Uuid" }
        limit: { $ref: "#/components/schemas/NonNegativeMoney" }
        source:
          type: string
          description: Whether the limit came from the regular schedule or a month-only entry.
          enum: [ regular, monthly ]
        purchases: { $ref: "#/components/schemas/AggregateMoney" }
        refunds: { $ref: "#/components/schemas/AggregateMoney" }
        net: { $ref: "#/components/schemas/AggregateMoney" }
        remaining:
          description: Limit minus net; negative when over.
          $ref: "#/components/schemas/AggregateMoney"
        percentUsed:
          description: Rounded display value; null for a $0 limit.
          type: [ integer, "null" ]
        planVersion: { $ref: "#/components/schemas/EntityVersion" }
    BudgetTotals:
      type: object
      additionalProperties: false
      required: [ limit, net, remaining, percentUsed ]
      properties:
        limit: { $ref: "#/components/schemas/AggregateMoney" }
        net: { $ref: "#/components/schemas/AggregateMoney" }
        remaining: { $ref: "#/components/schemas/AggregateMoney" }
        percentUsed:
          type: [ integer, "null" ]
    BudgetMonth:
      type: object
      additionalProperties: false
      required: [ month, items, totals, unbudgetedNet, uncategorizedNet, financeRevision ]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        items:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/BudgetLine" }
        totals: { $ref: "#/components/schemas/BudgetTotals" }
        unbudgetedNet:
          description: Net spending in expense categories without an effective limit.
          $ref: "#/components/schemas/AggregateMoney"
        uncategorizedNet: { $ref: "#/components/schemas/AggregateMoney" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    RegularScheduleEntry:
      type: object
      additionalProperties: false
      required: [ effectiveMonth, state, amount ]
      properties:
        effectiveMonth: { $ref: "#/components/schemas/YearMonth" }
        state:
          type: string
          enum: [ amount, stopped ]
        amount:
          oneOf:
            - $ref: "#/components/schemas/NonNegativeMoney"
            - type: "null"
    MonthlyEntry:
      type: object
      additionalProperties: false
      required: [ month, state, amount ]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        state:
          type: string
          enum: [ amount, skip ]
        amount:
          oneOf:
            - $ref: "#/components/schemas/NonNegativeMoney"
            - type: "null"
    BudgetPlan:
      type: object
      additionalProperties: false
      required: [ categoryId, version, regularSchedule, monthlyEntries, archiveCutoffMonth ]
      properties:
        categoryId: { $ref: "#/components/schemas/Uuid" }
        version:
          description: Null when the category has never had a budget.
          type: [ string, "null" ]
          pattern: "^[1-9][0-9]{0,17}$"
        regularSchedule:
          type: array
          maxItems: 1200
          items: { $ref: "#/components/schemas/RegularScheduleEntry" }
        monthlyEntries:
          type: array
          maxItems: 1200
          items: { $ref: "#/components/schemas/MonthlyEntry" }
        archiveCutoffMonth:
          description: Set only while the category is archived.
          type: [ string, "null" ]
          pattern: "^(19|2[0-9])[0-9]{2}-(0[1-9]|1[0-2])$"
    SetRegularBudgetChange:
      type: object
      additionalProperties: false
      required: [ change, fromMonth, amount ]
      properties:
        change:
          type: string
          const: set_regular
        fromMonth: { $ref: "#/components/schemas/YearMonth" }
        amount: { $ref: "#/components/schemas/NonNegativeMoney" }
    SetMonthBudgetChange:
      type: object
      additionalProperties: false
      required: [ change, month, amount ]
      properties:
        change:
          type: string
          const: set_month
        month: { $ref: "#/components/schemas/YearMonth" }
        amount: { $ref: "#/components/schemas/NonNegativeMoney" }
    SkipMonthBudgetChange:
      type: object
      additionalProperties: false
      required: [ change, month ]
      properties:
        change:
          type: string
          const: skip_month
        month: { $ref: "#/components/schemas/YearMonth" }
    StopBudgetChange:
      type: object
      additionalProperties: false
      required: [ change, fromMonth ]
      properties:
        change:
          type: string
          const: stop
        fromMonth: { $ref: "#/components/schemas/YearMonth" }
    BudgetChangeRequest:
      oneOf:
        - $ref: "#/components/schemas/SetRegularBudgetChange"
        - $ref: "#/components/schemas/SetMonthBudgetChange"
        - $ref: "#/components/schemas/SkipMonthBudgetChange"
        - $ref: "#/components/schemas/StopBudgetChange"
      discriminator:
        propertyName: change
        mapping:
          set_regular: "#/components/schemas/SetRegularBudgetChange"
          set_month: "#/components/schemas/SetMonthBudgetChange"
          skip_month: "#/components/schemas/SkipMonthBudgetChange"
          stop: "#/components/schemas/StopBudgetChange"
    EffectiveBudget:
      type: object
      additionalProperties: false
      required: [ state, amount, source ]
      properties:
        state:
          type: string
          enum: [ amount, absent ]
        amount:
          oneOf:
            - $ref: "#/components/schemas/NonNegativeMoney"
            - type: "null"
        source:
          type: [ string, "null" ]
          enum: [ regular, monthly, null ]
    BudgetTimelineMonth:
      type: object
      additionalProperties: false
      required: [ month, before, after ]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        before: { $ref: "#/components/schemas/EffectiveBudget" }
        after: { $ref: "#/components/schemas/EffectiveBudget" }
    BudgetChangePreview:
      type: object
      additionalProperties: false
      required: [ id, categoryId, request, status, capturedPlanVersion, timeline, removedEntries, createdAt, expiresAt, appliedAt ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        categoryId: { $ref: "#/components/schemas/Uuid" }
        request: { $ref: "#/components/schemas/BudgetChangeRequest" }
        status: { $ref: "#/components/schemas/PreviewStatus" }
        capturedPlanVersion:
          type: [ string, "null" ]
          pattern: "^[1-9][0-9]{0,17}$"
        timeline:
          description: The twelve months starting at the change month.
          type: array
          minItems: 12
          maxItems: 12
          items: { $ref: "#/components/schemas/BudgetTimelineMonth" }
        removedEntries:
          type: array
          maxItems: 1200
          items: { $ref: "#/components/schemas/BudgetEntry" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        appliedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    ApplyBudgetChangeRequest:
      type: object
      additionalProperties: false
      required: [ previewId ]
      properties:
        previewId: { $ref: "#/components/schemas/Uuid" }
    BudgetChangeApplyResult:
      type: object
      additionalProperties: false
      required: [ preview, plan, financeRevision ]
      properties:
        preview: { $ref: "#/components/schemas/BudgetChangePreview" }
        plan: { $ref: "#/components/schemas/BudgetPlan" }
        financeRevision: { $ref: "#/components/schemas/Revision" }

    # ------------------------------------------------------------ imports
    ImportLimits:
      type: object
      additionalProperties: false
      required: [ maxFileBytes, maxRows, maxColumns, maxFieldBytes ]
      properties:
        maxFileBytes: { type: integer, minimum: 1 }
        maxRows: { type: integer, minimum: 1 }
        maxColumns: { type: integer, minimum: 1 }
        maxFieldBytes: { type: integer, minimum: 1 }
    ImportFormatId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    ImportFormat:
      type: object
      additionalProperties: false
      required: [ id, version, label, providerKey, accountKind, evidence, limits ]
      properties:
        id: { $ref: "#/components/schemas/ImportFormatId" }
        version: { type: integer, minimum: 1 }
        label:
          type: string
          maxLength: 120
        providerKey: { $ref: "#/components/schemas/ProviderKey" }
        accountKind: { $ref: "#/components/schemas/AccountKind" }
        evidence:
          type: string
          description: "`verified` only after safe real headers were checked; presets are not claimed otherwise."
          enum: [ verified, unverified, synthetic_only ]
        limits: { $ref: "#/components/schemas/ImportLimits" }
    ImportFormatList:
      type: object
      additionalProperties: false
      required: [ items ]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ImportFormat" }
    ImportStatus:
      type: string
      enum: [ receiving, parsing, preview, committed, cancelled, expired, failed ]
    ImportRowCounts:
      type: object
      additionalProperties: false
      required: [ total, ready, held, excluded ]
      properties:
        total: { type: integer, minimum: 0 }
        ready: { type: integer, minimum: 0 }
        held: { type: integer, minimum: 0 }
        excluded: { type: integer, minimum: 0 }
    ImportOutcome:
      type: object
      additionalProperties: false
      description: Immutable once committed; follow-ups never change it.
      required: [ rows, added, excluded, pairedTransfers, completedAt ]
      properties:
        rows: { type: integer, minimum: 0 }
        added: { type: integer, minimum: 0 }
        excluded: { type: integer, minimum: 0 }
        pairedTransfers: { type: integer, minimum: 0 }
        completedAt: { $ref: "#/components/schemas/Timestamp" }
    ImportFailure:
      type: object
      additionalProperties: false
      required: [ code, message ]
      properties:
        code:
          type: string
          enum: [ unreadable_file, unsupported_encoding, malformed_csv, header_mismatch, limit_exceeded, upload_incomplete, pending_records_unsupported ]
        message:
          type: string
          maxLength: 300
    ImportBatch:
      type: object
      additionalProperties: false
      required: [ id, accountId, formatId, formatVersion, filename, status, parentImportId, createdAt, lastReviewedAt, expiresAt, version, rowCounts, staleReasons, commitBlockers, result, failure, uploadRetainedUntil ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        accountId: { $ref: "#/components/schemas/Uuid" }
        formatId: { $ref: "#/components/schemas/ImportFormatId" }
        formatVersion: { type: integer, minimum: 1 }
        filename:
          type: string
          description: Sanitized display name only; never used as a path.
          minLength: 1
          maxLength: 255
        status: { $ref: "#/components/schemas/ImportStatus" }
        parentImportId:
          description: Set for follow-up previews of a completed import's excluded rows.
          type: [ string, "null" ]
          format: uuid
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        lastReviewedAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt:
          description: 30 days after the last saved review activity while open; null once terminal.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        version: { $ref: "#/components/schemas/EntityVersion" }
        rowCounts: { $ref: "#/components/schemas/ImportRowCounts" }
        staleReasons:
          description: Inputs that changed since suggestions were computed; refresh before commit.
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ ledger_changed, rules_changed, account_archived ]
        commitBlockers:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ not_open, parsing, held_rows, needs_refresh, account_archived ]
        result:
          oneOf:
            - $ref: "#/components/schemas/ImportOutcome"
            - type: "null"
        failure:
          oneOf:
            - $ref: "#/components/schemas/ImportFailure"
            - type: "null"
        uploadRetainedUntil:
          description: When the stored upload copy will be deleted (30 days after commit).
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    CreateImportRequest:
      type: object
      additionalProperties: false
      required: [ accountId, formatId, file ]
      properties:
        accountId: { $ref: "#/components/schemas/Uuid" }
        formatId: { $ref: "#/components/schemas/ImportFormatId" }
        file:
          type: string
          format: binary
          contentMediaType: text/csv
          description: The bank's CSV export. The supplied filename is sanitized for display only.
    ImportCreateResult:
      type: object
      additionalProperties: false
      required: [ disposition, import, financeRevision ]
      properties:
        disposition:
          type: string
          enum: [ created, existing_preview, existing_completed ]
        import: { $ref: "#/components/schemas/ImportBatch" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    ImportBatchResult:
      type: object
      additionalProperties: false
      required: [ import, financeRevision ]
      properties:
        import: { $ref: "#/components/schemas/ImportBatch" }
        financeRevision: { $ref: "#/components/schemas/Revision" }
    ImportPage:
      type: object
      additionalProperties: false
      required: [ items, nextCursor, financeRevision ]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ImportBatch" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        financeRevision: { $ref: "#/components/schemas/Revision" }
    ImportRowState:
      type: string
      enum: [ ready, held, excluded ]
    RowIssue:
      type: object
      additionalProperties: false
      required: [ code, field, message ]
      properties:
        code:
          type: string
          enum: [ invalid_date, invalid_amount, fractional_cent, zero_amount, non_usd, missing_merchant, before_tracking_start, choose_type, suspected_duplicate, confirmed_duplicate, possible_transfer, suggestion_changed ]
        field:
          type: [ string, "null" ]
          enum: [ postedDate, money, merchant, kind, category, null ]
        message:
          type: string
          maxLength: 300
    NormalizedRow:
      type: object
      additionalProperties: false
      required: [ postedDate, merchant, money ]
      properties:
        postedDate:
          oneOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
        merchant:
          type: [ string, "null" ]
          maxLength: 2000
        money:
          description: May be zero or null while held for correction.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    DuplicateMatch:
      type: object
      additionalProperties: false
      required: [ transactionId, rowId, lifecycle, reason ]
      properties:
        transactionId:
          type: [ string, "null" ]
          format: uuid
        rowId:
          description: Another row in the same file.
          type: [ string, "null" ]
          format: uuid
        lifecycle:
          oneOf:
            - $ref: "#/components/schemas/Lifecycle"
            - type: "null"
        reason:
          type: string
          enum: [ bank_id, same_date_amount_description, within_file, matches_voided ]
    DuplicateReview:
      type: object
      additionalProperties: false
      required: [ status, matches, decision ]
      properties:
        status:
          type: string
          enum: [ none, confirmed, suspected ]
        matches:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/DuplicateMatch" }
        decision:
          description: Owner decision for a suspected duplicate; confirmed duplicates can only be excluded.
          type: [ string, "null" ]
          enum: [ include, exclude, null ]
    ImportTransferCandidate:
      type: object
      additionalProperties: false
      description: |
        An already-posted counterpart in another owned account. Confirming it
        pairs the two at commit and, if `requiresKindChange`, changes the
        counterpart's type to `transfer` in the same transaction. Commit
        rechecks `counterpartVersion` and the counterpart account's state.
      required: [ transactionId, accountId, counterpartKind, counterpartVersion, requiresKindChange, eligible, ineligibleReason, postedDate, money, daysApart, decision ]
      properties:
        transactionId: { $ref: "#/components/schemas/Uuid" }
        accountId: { $ref: "#/components/schemas/Uuid" }
        counterpartKind: { $ref: "#/components/schemas/TransactionKind" }
        counterpartVersion: { $ref: "#/components/schemas/EntityVersion" }
        requiresKindChange: { type: boolean }
        eligible:
          description: False when the counterpart is voided, already paired, or on an archived account and would need a type change.
          type: boolean
        ineligibleReason:
          type: [ string, "null" ]
          enum: [ already_paired, reactivation_required, voided, null ]
        postedDate: { $ref: "#/components/schemas/LocalDate" }
        money: { $ref: "#/components/schemas/NonZeroMoney" }
        daysApart: { type: integer, minimum: 0, maximum: 7 }
        decision:
          type: [ string, "null" ]
          enum: [ confirm, reject, null ]
    ImportRow:
      type: object
      additionalProperties: false
      required: [ id, rowNumber, state, sourceFields, normalized, issues, kind, kindSource, assignment, duplicate, transferCandidate, excluded, reviewRequired, postedTransactionId, version ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        rowNumber: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/ImportRowState" }
        sourceFields:
          description: |
            Retained source values by header, never modified. Only columns the
            adapter declares are retained; a column that can carry a full
            account or card number is never retained (at most its last four
            digits).
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 16384
        normalized: { $ref: "#/components/schemas/NormalizedRow" }
        issues:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/RowIssue" }
        kind:
          oneOf:
            - $ref: "#/components/schemas/TransactionKind"
            - type: "null"
        kindSource:
          description: Where the type came from; null while the owner must choose.
          type: [ string, "null" ]
          enum: [ bank, transfer_candidate, default, owner, null ]
        assignment:
          description: Proposed category; manual choices become protected on commit.
          oneOf:
            - $ref: "#/components/schemas/AssignmentState"
            - type: "null"
        duplicate: { $ref: "#/components/schemas/DuplicateReview" }
        transferCandidate:
          oneOf:
            - $ref: "#/components/schemas/ImportTransferCandidate"
            - type: "null"
        excluded: { type: boolean }
        reviewRequired:
          description: Suggestions changed after a refresh.
          type: boolean
        postedTransactionId:
          type: [ string, "null" ]
          format: uuid
        version: { $ref: "#/components/schemas/EntityVersion" }
    ImportRowPage:
      type: object
      additionalProperties: false
      required: [ items, nextCursor, importVersion ]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ImportRow" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        importVersion: { $ref: "#/components/schemas/EntityVersion" }
    UpdateImportRowRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        postedDate: { $ref: "#/components/schemas/LocalDate" }
        money: { $ref: "#/components/schemas/NonZeroMoney" }
        merchant:
          type: string
          minLength: 1
          maxLength: 2000
        kind: { $ref: "#/components/schemas/TransactionKind" }
        category: { $ref: "#/components/schemas/CategoryChoice" }
        excluded: { type: boolean }
        duplicateDecision:
          type: string
          enum: [ include, exclude ]
        transferDecision:
          type: string
          enum: [ confirm, reject ]
    ImportRowResult:
      type: object
      additionalProperties: false
      required: [ row, import ]
      properties:
        row: { $ref: "#/components/schemas/ImportRow" }
        import: { $ref: "#/components/schemas/ImportBatch" }
    BulkTypeRequest:
      type: object
      additionalProperties: false
      required: [ rowId, kind ]
      properties:
        rowId:
          description: Row whose normalized description selects the rows to update.
          $ref: "#/components/schemas/Uuid"
        kind: { $ref: "#/components/schemas/TransactionKind" }
    BulkTypeResult:
      type: object
      additionalProperties: false
      required: [ updatedRowIds, skippedRowIds, import ]
      properties:
        updatedRowIds:
          type: array
          maxItems: 25000
          items: { $ref: "#/components/schemas/Uuid" }
        skippedRowIds:
          type: array
          maxItems: 25000
          items: { $ref: "#/components/schemas/Uuid" }
        import: { $ref: "#/components/schemas/ImportBatch" }
    CreateFollowUpRequest:
      type: object
      additionalProperties: false
      required: [ id ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }

    # ------------------------------------------------------------ preferences, export, operations
    Preferences:
      type: object
      additionalProperties: false
      required: [ displayName, density, currency, timezone, version ]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          pattern: "\\S"
        density:
          type: string
          enum: [ standard, compact ]
        currency:
          type: string
          const: USD
        timezone:
          type: string
          const: America/New_York
        version: { $ref: "#/components/schemas/EntityVersion" }
    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          pattern: "\\S"
        density:
          type: string
          enum: [ standard, compact ]
    LedgerExport:
      type: object
      additionalProperties: false
      required: [ formatVersion, exportedAt, currency, timezone, preferences, accounts, checkpoints, transactions, transactionHistory, transferPairs, refundLinks, categories, rules, ruleHistory, ruleRuns, budgetPlans, imports ]
      properties:
        formatVersion:
          type: integer
          const: 1
        exportedAt: { $ref: "#/components/schemas/Timestamp" }
        currency:
          type: string
          const: USD
        timezone:
          type: string
          const: America/New_York
        preferences: { $ref: "#/components/schemas/Preferences" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        checkpoints:
          type: array
          items: { $ref: "#/components/schemas/CheckpointHistory" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        transactionHistory:
          type: array
          items: { $ref: "#/components/schemas/HistoryEvent" }
        transferPairs:
          type: array
          items: { $ref: "#/components/schemas/TransferPair" }
        refundLinks:
          type: array
          items: { $ref: "#/components/schemas/RefundLink" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/Rule" }
        ruleHistory:
          type: array
          items: { $ref: "#/components/schemas/RuleHistory" }
        ruleRuns:
          type: array
          items: { $ref: "#/components/schemas/RuleRun" }
        budgetPlans:
          type: array
          items: { $ref: "#/components/schemas/BudgetPlan" }
        imports:
          description: Normalized import history with retained rows; raw uploads are never included.
          type: array
          items: { $ref: "#/components/schemas/ExportedImport" }
    ExportedImport:
      type: object
      additionalProperties: false
      required: [ batch, rows ]
      properties:
        batch: { $ref: "#/components/schemas/ImportBatch" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportRow" }
    BackupDestinationStatus:
      type: object
      additionalProperties: false
      required: [ destination, state, lastSuccessAt, lastAttemptAt, errorCode ]
      properties:
        destination:
          type: string
          description: "`local` is the RAID5 repository; `independent` is the encrypted off-host copy."
          enum: [ local, independent ]
        state:
          type: string
          enum: [ ok, stale, failed, never_run, unknown ]
        lastSuccessAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        lastAttemptAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        errorCode:
          type: [ string, "null" ]
          pattern: "^[a-z][a-z0-9_]{0,63}$"
    BackupStatus:
      type: object
      additionalProperties: false
      required: [ statusFile, readAt, destinations ]
      properties:
        statusFile:
          type: string
          enum: [ readable, missing, unreadable ]
        readAt: { $ref: "#/components/schemas/Timestamp" }
        destinations:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/BackupDestinationStatus" }

  responses:
    BadRequest:
      description: Malformed JSON, query or header
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidRequest: { $ref: "#/components/examples/Problem_invalid_request" }
    BadRequestList:
      description: Malformed query, cursor, or a cursor used with different filters
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidRequest: { $ref: "#/components/examples/Problem_invalid_request" }
            invalidCursor: { $ref: "#/components/examples/Problem_invalid_cursor" }
            cursorMismatch: { $ref: "#/components/examples/Problem_cursor_filter_mismatch" }
    Unauthenticated:
      description: No valid session; sign in again
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            sessionExpired: { $ref: "#/components/examples/Problem_session_expired" }
            notAuthenticated: { $ref: "#/components/examples/Problem_not_authenticated" }
    Forbidden:
      description: Missing/invalid CSRF token or cross-origin request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            csrfInvalid: { $ref: "#/components/examples/Problem_csrf_invalid" }
            originRejected: { $ref: "#/components/examples/Problem_origin_rejected" }
    NotFound:
      description: Unknown resource (also a repeated delete)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            notFound: { $ref: "#/components/examples/Problem_not_found" }
    Gone:
      description: The preview expired; start a new reviewed attempt
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            previewExpired: { $ref: "#/components/examples/Problem_preview_expired" }
    GoneImport:
      description: The preview expired or its review contents were deleted; upload again
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            previewExpired: { $ref: "#/components/examples/Problem_preview_expired" }
            contentsDeleted: { $ref: "#/components/examples/Problem_import_contents_deleted" }
    PreconditionFailed:
      description: The record changed since it was read; refetch and review
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            versionMismatch: { $ref: "#/components/examples/Problem_version_mismatch" }
    PreconditionRequired:
      description: The If-Match header is missing
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            ifMatchMissing: { $ref: "#/components/examples/Problem_precondition_required" }
    PayloadTooLarge:
      description: A size or row limit was exceeded; nothing was saved
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            tooLarge: { $ref: "#/components/examples/Problem_payload_too_large" }
    UnsupportedMediaType:
      description: Wrong content type or unsupported file encoding
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unsupported: { $ref: "#/components/examples/Problem_unsupported_media_type" }
    ValidationFailed:
      description: Semantic validation failed; nothing was saved
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidField: { $ref: "#/components/examples/Problem_validation_failed" }
    TooManyRequests:
      description: Throttled; wait for Retry-After
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            throttled: { $ref: "#/components/examples/Problem_login_throttled" }
    ServiceUnavailable:
      description: Temporarily busy (database lock wait) or in maintenance; bounded retry honoring Retry-After
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            busy: { $ref: "#/components/examples/Problem_service_busy" }
            maintenance: { $ref: "#/components/examples/Problem_maintenance" }
    InternalError:
      description: Unexpected fault, reported with a safe message and request ID; never a partial result
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            internal: { $ref: "#/components/examples/Problem_internal_error" }

  examples:
    # ================================================================ problems (one per code)
    Problem_invalid_request:
      value: { type: "urn:money-desk:problem:invalid_request", title: The request is not valid, status: 400, code: invalid_request, detail: "Use either month or from/to, not both.", requestId: 50000000-0000-4000-8000-000000000001, fieldErrors: [{ path: month, code: mutually_exclusive, message: Choose a month or a date range. }] }
    Problem_invalid_cursor:
      value: { type: "urn:money-desk:problem:invalid_cursor", title: The list position is not valid, status: 400, code: invalid_cursor, detail: "Reload the list from the first page.", requestId: 50000000-0000-4000-8000-000000000002 }
    Problem_cursor_filter_mismatch:
      value: { type: "urn:money-desk:problem:cursor_filter_mismatch", title: The list filters changed, status: 400, code: cursor_filter_mismatch, detail: "Reload the list from the first page.", requestId: 50000000-0000-4000-8000-000000000003 }
    Problem_not_authenticated:
      value: { type: "urn:money-desk:problem:not_authenticated", title: Signed out, status: 401, code: not_authenticated, detail: "Sign in to continue.", requestId: 50000000-0000-4000-8000-000000000004 }
    Problem_session_expired:
      value: { type: "urn:money-desk:problem:session_expired", title: Signed out, status: 401, code: session_expired, detail: "Your session ended after 30 minutes of inactivity. Sign in again.", requestId: 50000000-0000-4000-8000-000000000005 }
    Problem_invalid_credentials:
      value: { type: "urn:money-desk:problem:invalid_credentials", title: Sign-in failed, status: 401, code: invalid_credentials, detail: "The password is not correct.", requestId: 50000000-0000-4000-8000-000000000006 }
    Problem_origin_rejected:
      value: { type: "urn:money-desk:problem:origin_rejected", title: Request blocked, status: 403, code: origin_rejected, detail: "Requests must come from The Money Desk itself.", requestId: 50000000-0000-4000-8000-000000000007 }
    Problem_csrf_invalid:
      value: { type: "urn:money-desk:problem:csrf_invalid", title: Request blocked, status: 403, code: csrf_invalid, detail: "Reload the page and try again. No changes were saved.", requestId: 50000000-0000-4000-8000-000000000008 }
    Problem_not_found:
      value: { type: "urn:money-desk:problem:not_found", title: Not found, status: 404, code: not_found, detail: "This record does not exist or was deleted.", requestId: 50000000-0000-4000-8000-000000000009 }
    Problem_preview_expired:
      value: { type: "urn:money-desk:problem:preview_expired", title: Preview expired, status: 410, code: preview_expired, detail: "Create a new preview and review it again.", requestId: 50000000-0000-4000-8000-00000000000a }
    Problem_import_contents_deleted:
      value: { type: "urn:money-desk:problem:import_contents_deleted", title: Review contents deleted, status: 410, code: import_contents_deleted, detail: "This import was discarded or expired. Upload the file again to review it.", requestId: 50000000-0000-4000-8000-00000000000b }
    Problem_client_id_conflict:
      value: { type: "urn:money-desk:problem:client_id_conflict", title: Already used for something else, status: 409, code: client_id_conflict, detail: "This create was already saved with different values. Reload before trying again.", requestId: 50000000-0000-4000-8000-00000000000c }
    Problem_preview_stale:
      value: { type: "urn:money-desk:problem:preview_stale", title: Preview is out of date, status: 409, code: preview_stale, detail: "Records it depends on changed. Refresh the preview and review it again. Nothing was changed.", requestId: 50000000-0000-4000-8000-00000000000d }
    Problem_reactivation_required:
      value: { type: "urn:money-desk:problem:reactivation_required", title: Account is archived, status: 409, code: reactivation_required, detail: "Reactivate Synthetic Card first. No changes were saved.", requestId: 50000000-0000-4000-8000-00000000000e }
    Problem_account_in_use:
      value:
        type: "urn:money-desk:problem:account_in_use"
        title: Account has history
        status: 409
        code: account_in_use
        detail: Accounts with history cannot be deleted. Archive it instead.
        requestId: 50000000-0000-4000-8000-00000000000f
        blocking:
          - { kind: transaction, count: 6, ids: [10000000-0000-4000-8000-000000000001, 10000000-0000-4000-8000-000000000002] }
          - { kind: import, count: 2, ids: [40000000-0000-4000-8000-000000000001, 40000000-0000-4000-8000-000000000002] }
          - { kind: checkpoint, count: 1, ids: [70000000-0000-4000-8000-000000000001] }
    Problem_active_transactions_before_start:
      value:
        type: "urn:money-desk:problem:active_transactions_before_start"
        title: Transactions before the new start
        status: 409
        code: active_transactions_before_start
        detail: Void these transactions first if they are wrong; nothing is dropped silently.
        requestId: 50000000-0000-4000-8000-000000000010
        blocking:
          - { kind: transaction, count: 1, ids: [10000000-0000-4000-8000-000000000001] }
    Problem_category_archived:
      value: { type: "urn:money-desk:problem:category_archived", title: Category is archived, status: 409, code: category_archived, detail: "Dining is archived. Reactivate it or choose another category.", requestId: 50000000-0000-4000-8000-000000000011 }
    Problem_category_protected:
