    get:
      operationId: getAccountBalance
      tags: [ accounts ]
      summary: Calculated balance at the end of a date
      description: |
        Opening balance plus active movements dated on or after the tracking
        start and on or before `asOf`. On the day before the tracking start the
        balance is the opening balance (that day's closing balance). Earlier
        dates are `outside_coverage` with a null balance, never a fabricated
        zero.
      parameters:
        - name: asOf
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LocalDate"
          example: "2026-04-30"
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
              examples:
                covered:
                  $ref: "#/components/examples/GetAccountBalance_covered"
                outside:
                  $ref: "#/components/examples/GetAccountBalance_outside"
