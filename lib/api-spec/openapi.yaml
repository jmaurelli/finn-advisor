            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /accounts/{accountId}/baseline:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: changeAccountBaseline
      tags: [ accounts ]
      summary: Correct the opening balance, move the start later, or extend coverage backward
      description: |
        One atomic, audited command against the account version.
        - `correct_opening_balance`: same start date, new opening balance.
        - `move_start_later`: refused with 409 `active_transactions_before_start`
          (blocking transaction IDs listed) while any active transaction is
          dated before the new start. Voided rows do not block.
        - `extend_backward`: new earlier start, the matching opening balance
          for the day before it, and optionally held earlier rows from one
          import preview posted in the same transaction.
        Archived accounts return 409 `reactivation_required`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaselineChangeRequest"
            examples:
              correctOpening:
                $ref: "#/components/examples/ChangeAccountBaseline_request_correctOpening"
              extendBackward:
                $ref: "#/components/examples/ChangeAccountBaseline_request_extendBackward"
      responses:
        "200":
          description: Baseline changed
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineChangeResult"
              examples:
                extended:
                  $ref: "#/components/examples/ChangeAccountBaseline_extended"
        "400":
