  /imports/{importId}/commit:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: commitImport
      tags: [ imports ]
      summary: Confirm and post the whole batch atomically
      description: |
        Checks session, version, expiry, account active state, the captured
        ledger and rule-set revisions, every held row and type decision and
        duplicate identities inside one write transaction. Posts all ready
        rows with confirmed transfer pairs, or nothing. For each confirmed
        pair it rechecks the counterpart's version and account: a changed
        counterpart makes the preview stale, and a counterpart whose type must
        change on an archived account needs reactivation. Held rows return 409
        `held_rows_unresolved`; changed inputs return 409 `preview_stale`
        (refresh first); archived accounts 409 `reactivation_required`.
        If the batch was already committed, returns the recorded result with
        200 regardless of `If-Match`, even if the account was archived since.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Committed (or the recorded result of the earlier commit)
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchResult"
              examples:
                committed:
                  $ref: "#/components/examples/CommitImport_committed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
