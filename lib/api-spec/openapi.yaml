      - $ref: "#/components/parameters/CategoryId"
    get:
      operationId: getBudgetPlan
      tags: [ budgets ]
      summary: A category's regular schedule and monthly entries
      description: |
        A category that never had a budget returns an empty plan with a null
        version (no ETag).
      responses:
