    patch:
      operationId: updateImportRow
      tags: [ imports ]
      summary: Save a review decision or correction for one row
      description: |
        Corrects date, amount or merchant; chooses the type; chooses a
        category or returns it to rules; excludes or re-includes; decides a
        suspected duplicate; confirms or rejects a suggested transfer pair.
        Confirmed bank-ID duplicates cannot be included. Saves count as review
        activity and extend expiry to 30 days from now. Original source fields
        are never changed. Preview must be open (409 `import_not_open`).
        `If-Match` carries the import batch version (as for commit); the
        response `ETag` is the new batch version. A confirmed bank-ID duplicate
        cannot be included (409 `duplicate_source_identity`).
