  /rule-runs:
    post:
      operationId: createRuleRun
      tags: [ rules ]
      summary: Preview reapplying the current rules to past transactions
      description: |
        Owner selects the scope; at most 25,000 candidate rows (422
        `scope_too_large` otherwise; nothing is silently truncated). Manual
        assignments and archived accounts are never candidates; voided rows
        are excluded. Rule-assigned rows with no current match would return
        to Uncategorized. Changes nothing until applied. Stale when the
        rule-set revision or any candidate's version changes; expires after
        24 hours.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRunRequest"
            examples:
              april:
                $ref: "#/components/examples/CreateRuleRun_request_april"
