  /accounts/{accountId}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listCheckpoints
      tags: [ accounts ]
      summary: List reconciliation checkpoints with derived status
      description: |
        Status is computed on read:
        - `not_checked`: no comparison yet.
        - `difference`: the latest comparison did not match.
        - `reconciled`: the latest comparison matched and the balance for the
          closing date still equals the balance recorded then.
        - `needs_recheck`: the latest comparison matched but that balance has
          changed since, including when a later tracking start leaves the
          closing date outside coverage (current balance null).
      responses:
        "200":
          description: Checkpoints, newest closing date first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointList"
              examples:
                aprilStatement:
                  $ref: "#/components/examples/ListCheckpoints_aprilStatement"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createCheckpoint
      tags: [ accounts ]
      summary: Record a statement closing balance and compare it
      description: |
        Stores the entered statement balance and records the first explicit
        comparison. A difference stays visible; no adjustment is ever created.
        The closing date must be on or after the day before the tracking start
        (422 `validation_failed` otherwise).
        Retry-safe through the client-supplied `id`. Archived accounts return
        409 `reactivation_required`.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckpointRequest"
