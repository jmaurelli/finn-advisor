  /budget-plans/{categoryId}/preview-change:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: previewBudgetChange
      tags: [ budgets ]
      summary: Preview a budget change and the resulting month-by-month timeline
      description: |
        Variants: `set_regular` (from a month onward, keeping later scheduled
        changes and monthly entries), `set_month` (one month only, no
        recurring base needed), `skip_month`, and `stop` (removes entries at
        or after the month). `set_month` and `skip_month` accept any month;
        `set_regular` and `stop` require the current Eastern month or later
        (422 `month_in_past`). Only active expense categories are eligible.
        Captures the plan version; expires after 24 hours.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetChangeRequest"
            examples:
              setRegular:
                $ref: "#/components/examples/PreviewBudgetChange_request_setRegular"
              monthOnly:
