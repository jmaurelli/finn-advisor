  # ---------------------------------------------------------------- repairs
  /transactions/{transactionId}/repair-previews:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: createRepairPreview
      tags: [ repairs ]
      summary: Preview an amount/date correction, void or restore
      description: |
        Changes no ledger values. Captures the versions of the transaction,
        its account and any links, and reports balance, month and checkpoint
        impact plus any links that must be unlinked. A preview is stale when a
        captured version changes and expires 24 hours after creation.
        Corrections must keep the amount's sign compatible with the kind.
        Archived accounts return 409 `reactivation_required`.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequest"
            examples:
              correctAmount:
                $ref: "#/components/examples/CreateRepairPreview_request_correctAmount"
              void:
                $ref: "#/components/examples/CreateRepairPreview_request_void"
      responses:
        "201":
          description: Preview ready for review
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairPreview"
              examples:
                linkedTransfer:
                  $ref: "#/components/examples/CreateRepairPreview_linkedTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                reactivationRequired:
                  $ref: "#/components/examples/Problem_reactivation_required"
        "422":
          description: Semantic validation failed; nothing was saved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                kindSignMismatch:
                  $ref: "#/components/examples/Problem_kind_sign_mismatch"
                validationFailed:
                  $ref: "#/components/examples/Problem_validation_failed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
