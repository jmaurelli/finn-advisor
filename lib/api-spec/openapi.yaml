      operationId: archiveCategory
      tags: [ categories ]
      summary: Archive a category with its rule resolutions and budget stop
      description: |
        In one transaction: applies a resolution to every active, enabled rule
        that targets the category (disable, or retarget to another active expense
        category), stops its budget from next Eastern month, and archives it.
        Requires the category `If-Match`, the rule-set revision and the budget
        plan version from the impact read.
      security:
