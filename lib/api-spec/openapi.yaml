  # ---------------------------------------------------------------- reports
  /summary:
    get:
      operationId: getMonthSummary
      tags: [ reports ]
      summary: Spending, income, balances and review counts for one Eastern month
      description: |
        Canonical period summary for the overview. Voided transactions are
        excluded. Spending is purchases minus refunds by posted month;
        transfers affect only balances. Review counts replace hardcoded badges.
      parameters:
        - $ref: "#/components/parameters/MonthRequired"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthSummary"
              examples:
                april:
                  $ref: "#/components/examples/GetMonthSummary_april"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------- transactions
  /transactions:
    get:
      operationId: listTransactions
      tags: [ transactions ]
      summary: Search and filter transactions (keyset paginated)
      description: |
        Filters combine with AND. `month` is mutually exclusive with
        `from`/`to` (inclusive `from`, exclusive `to`). `q` is a literal,
        case-insensitive substring over merchant text and notes (`%`, `_` and
        regex characters have no special meaning). Order is posted date
        descending, then ID descending. `totals` always cover every matching
        row, computed in the same read snapshot as the page; financial totals
        exclude voided rows even when `lifecycle` shows them.
      parameters:
        - $ref: "#/components/parameters/FilterAccountId"
        - $ref: "#/components/parameters/FilterCategoryId"
        - $ref: "#/components/parameters/FilterKind"
        - $ref: "#/components/parameters/FilterOrigin"
        - $ref: "#/components/parameters/FilterLifecycle"
        - $ref: "#/components/parameters/FilterMonth"
        - $ref: "#/components/parameters/FilterFrom"
        - $ref: "#/components/parameters/FilterTo"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/TransactionLimit"
      responses:
        "200":
          description: One page plus whole-scope totals
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
