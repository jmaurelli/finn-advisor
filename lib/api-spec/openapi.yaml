        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain or lifecycle conflict; refresh and review rather than overwrite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                categoryArchived:
                  $ref: "#/components/examples/Problem_category_archived"
                clientIdConflict:
