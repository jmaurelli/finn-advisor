          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointResult"
              examples:
                replayed:
                  $ref: "#/components/examples/CreateCheckpoint_replayed"
        "201":
          description: Created with its first comparison
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointResult"
              examples:
                reconciled:
                  $ref: "#/components/examples/CreateCheckpoint_reconciled"
        "400":
