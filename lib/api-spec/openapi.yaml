    get:
      operationId: listTransferCandidates
      tags: [ links ]
      summary: Possible transfer counterparts
      description: |
        Without filters, suggests active transactions in other owned accounts
        with the equal and opposite amount posted within seven calendar days,
        nearest first. The window is a suggestion only; `from`/`to`/`accountId`
        widen or narrow the search for explicit linking. Never links anything.
      parameters:
